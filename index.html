/* ===== الألوان والمتغيرات العامة (تتغير من الإعدادات) ===== */
:root{--bg:#fff7fa;--card:#fff;--ink:#45293a;--muted:#957a88;--pri:#e75a8c;--soft:#e75a8c26;--hl:#2563eb;--ok:#2fa36b;--bad:#e2554f;--warn:#f0a531;--line:#f3dbe6;--r:18px}
html.dark{--bg:#1a1420;--card:#2a2030;--ink:#f3e8f0;--muted:#b9a3b1;--line:#4a3a4a;--soft:#e75a8c33}
html.dark body{background:var(--bg);color:var(--ink)}
html.dark input,html.dark select,html.dark textarea{background:#1a1420;color:var(--ink);border-color:#4a3a4a}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}
body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Geeza Pro",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
#app{max-width:780px;margin:0 auto;padding:12px 12px 40px}
h1,h2,h3,h4{margin:.35em 0}
.hidden{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.center{justify-content:center;text-align:center}
.muted{color:var(--muted);font-size:14px}
.btn{border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700;background:var(--pri);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--soft);color:var(--pri);box-shadow:none}
.btn.ok{background:var(--ok)}.btn.danger{background:var(--bad)}.btn.warn{background:var(--warn)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 4px 16px rgba(120,40,80,.08);margin-bottom:12px}
.hero{text-align:center;padding:18px 10px;border-radius:24px;background:linear-gradient(135deg,var(--soft),#fff);margin-bottom:14px;border:2px solid var(--soft)}
.hero h1{font-size:26px;color:var(--pri)}
.kids{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kid{border:0;border-radius:24px;padding:22px 10px;color:#fff;font-size:24px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.kid .em{font-size:56px;display:block}
.kid small{display:block;font-size:14px;font-weight:600;opacity:.95;margin-top:4px}
.tiles-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ext-tile{position:relative}
.fav-btn{position:absolute;top:6px;left:8px;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;z-index:1;padding:4px}

.big-tile{border:0;border-radius:22px;padding:16px 8px;background:#fff;font-size:17px;font-weight:800;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.big-tile .em{font-size:38px;display:block;margin-bottom:6px}
.big-tile.main{grid-column:1/-1;color:#fff;background:var(--pri)}
.stat-badge{font-size:12px;padding:3px 8px;border-radius:20px;display:inline-block;margin-top:6px;font-weight:700}
.st-new{background:#eee;color:#777}.st-learning{background:#fff1cc;color:#946200}.st-near{background:#dff3ff;color:#1a6a9a}.st-mastered{background:#d9f6e6;color:#1d7a4b}.st-support{background:#ffe0de;color:#b0302a}.st-advanced{background:#fde68a;color:#7c4a00}
.hl{color:var(--hl);font-weight:900}
.hb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hb{border:0;border-radius:18px;padding:10px 4px;background:#fff;box-shadow:0 4px 0 var(--line);color:var(--ink)}
.hb b{display:block;font-size:50px;font-family:"Traditional Arabic","Amiri","Noto Naskh Arabic",serif;line-height:1.3}
.hb small{font-size:13px;color:var(--muted);font-weight:700}
.hb.short b{color:#e75a8c}.hb.long b{color:#2f7fd8}.hb.sk b{color:#2fa36b}.hb.tn b{color:#b07a16}
.ava{border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.15);vertical-align:middle}
/* ===== شاشة النشاط ===== */
.playbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.prog{flex:1;height:12px;background:var(--line);border-radius:10px;overflow:hidden}
.prog>div{height:100%;background:var(--pri);transition:width .3s}
.pill{background:#fff;border-radius:20px;padding:6px 10px;font-weight:800;font-size:15px;white-space:nowrap}
.qcard{background:#fff;border-radius:26px;padding:16px;box-shadow:0 6px 20px rgba(120,40,80,.1);text-align:center;position:relative}
.speakwrap{position:absolute;top:12px;inset-inline-end:12px;z-index:2}
.speakwrap .speak-btn{margin:0;width:56px;height:56px;font-size:24px}
.speakwrap .speak-btn.small{width:auto;height:auto;font-size:16px}
.qskill{font-size:13px;color:var(--muted);font-weight:700}
.qprompt{font-size:20px;font-weight:800;margin:6px 0 10px}
.speak-btn{border:0;background:var(--pri);color:#fff;font-size:34px;width:78px;height:78px;border-radius:50%;box-shadow:0 5px 0 rgba(0,0,0,.12);margin:4px auto 10px;display:block}
.speak-btn.small{font-size:18px;width:auto;height:auto;border-radius:16px;padding:8px 14px;display:inline-block}
.qvisual{margin:6px 0 12px}
.options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.options.g2{grid-template-columns:1fr 1fr}
.opt{border:3px solid var(--line);background:#fff;border-radius:20px;min-height:86px;padding:8px;font-size:20px;font-weight:800;color:var(--ink);transition:.15s}
.opt.right{border-color:var(--ok);background:#e2f8ec}
.opt.wrong{border-color:var(--bad);background:#ffe9e8;animation:shake .35s}
.opt.gone{opacity:.15;pointer-events:none}
.opt.reveal{animation:pulse 1s infinite;border-color:var(--ok);background:#e2f8ec}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pulse{50%{transform:scale(1.06)}}
.ar-letter{font-size:56px;font-family:"Traditional Arabic","Amiri","Noto Naskh Arabic","Times New Roman",serif;line-height:1}
.ar-syl{font-size:48px;font-family:"Traditional Arabic","Amiri","Noto Naskh Arabic","Times New Roman",serif;line-height:1.1}
.ar-word{font-size:34px;font-family:"Traditional Arabic","Amiri","Noto Naskh Arabic","Times New Roman",serif}
.ar-big{font-size:64px;font-family:"Traditional Arabic","Amiri","Noto Naskh Arabic","Times New Roman",serif;line-height:1.3}
.en-letter{font-size:50px;font-family:"Comic Sans MS","Segoe UI",Arial,sans-serif}
.en-word{font-size:30px;font-family:"Comic Sans MS","Segoe UI",Arial,sans-serif}
.gap{display:inline-block;min-width:44px;border:3px dashed var(--pri);border-radius:10px;color:var(--pri);font-size:.7em;vertical-align:middle;margin:0 3px;font-family:Arial}
.num{font-size:40px;font-family:Arial,sans-serif}
.emoji-xl{font-size:64px;line-height:1.1}
.emoji-opt{font-size:50px}
.word-pic{width:200px;height:200px;object-fit:contain;border-radius:18px;background:#fff;display:block;margin:0 auto}
.word-pic-opt{width:84px;height:84px;object-fit:contain;border-radius:12px;background:#fff}
.word-credit{font-size:11px;color:#777;text-align:center}
.egrid{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:30px;max-width:360px;margin:0 auto}
.egrid.sm{font-size:18px;max-width:120px}
.egrid .x{opacity:.35;text-decoration:line-through}
/* الضغط على الرمز يضع علامة ✖ فوقه ليعرف الطفل ما عدّه، والضغط مرة أخرى يلغيها */
.egrid span{position:relative;cursor:pointer;display:inline-block;user-select:none;-webkit-user-select:none}
.egrid span.mk::after{content:'✖';position:absolute;inset:0;display:grid;place-items:center;color:#e35d5d;font-size:.75em;font-weight:900;background:rgba(255,255,255,.55);border-radius:50%;text-shadow:0 0 3px #fff}
.expr{font-size:42px;font-weight:800;font-family:Arial,sans-serif}
.blank{display:inline-block;min-width:54px;border-bottom:4px dashed var(--pri);color:var(--pri)}
.seq{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.seq span{min-width:60px;padding:10px 6px;border-radius:14px;background:var(--soft);font-size:30px;font-weight:800;font-family:Arial,sans-serif}
.seq span.q{background:#fff;border:3px dashed var(--pri);color:var(--pri)}
.rods{display:flex;justify-content:center;gap:5px;align-items:flex-end;flex-wrap:wrap}
.rod{width:16px;height:120px;background:repeating-linear-gradient(#5aa9e6 0 10px,#fff 10px 12px);border-radius:4px}
.cube{width:16px;height:16px;background:#f08bb0;border-radius:3px}
.cubes{display:flex;flex-direction:column;gap:2px;margin-inline-start:10px}
.pict{display:inline-block;text-align:start}
.pict div{font-size:28px;margin:4px 0;padding:4px 8px;border-bottom:1px solid var(--line)}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px 0;min-height:70px}
.slot{min-width:60px;height:66px;border:3px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;background:#fffafc;padding:0 6px}
.slot.filled{border-style:solid;border-color:var(--pri);background:#fff}
.preview{font-size:40px;min-height:52px;font-family:"Traditional Arabic","Amiri","Noto Naskh Arabic",serif;color:var(--pri)}
.tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.tile{border:0;background:var(--soft);border-radius:14px;min-width:64px;height:68px;padding:0 10px;font-size:30px;font-weight:800;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.tile.used{opacity:.25;pointer-events:none}
.tile .ar-letter,.slot .ar-letter{font-size:40px}
.tile .en-letter,.slot .en-letter{font-size:34px}
.tw{font-size:26px;font-family:"Traditional Arabic","Amiri","Noto Naskh Arabic",serif}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mitem{border:3px solid var(--line);background:#fff;border-radius:18px;min-height:76px;font-size:22px;font-weight:800;color:var(--ink)}
.mitem.sel{border-color:var(--pri);background:var(--soft)}
.mitem.done{border-color:var(--ok);background:#e2f8ec;pointer-events:none}
.mitem.wrong{border-color:var(--bad);animation:shake .35s}
.hintbox{margin:8px 0;min-height:4px}
.qtools{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
canvas#trace{background:#fff;border:3px solid var(--line);border-radius:18px;touch-action:none;display:block;margin:0 auto}
.rate-btns{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
@keyframes cheerUp{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-95vh) rotate(var(--rot));opacity:0}}
.cheer{position:fixed;bottom:-40px;pointer-events:none;z-index:49;font-size:34px;animation:cheerUp var(--dur) ease-out forwards}
@keyframes sadPop{0%{transform:scale(.4);opacity:0}20%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.wrongface{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:90px;pointer-events:none;z-index:50;animation:sadPop 1.4s forwards}
.wrongface .encour{font-size:24px;margin-top:8px;color:#333;background:#fff;border-radius:16px;padding:8px 14px;animation:bob .5s ease-in-out 3}
.rewardbar{margin:6px 0 10px}
.rw-top{display:flex;justify-content:space-between;font-size:16px;margin-bottom:4px}
.rw-track{height:14px;background:#f5dbe5;border-radius:10px;overflow:hidden}
.rw-fill{height:100%;background:var(--pri);border-radius:10px;transition:width .4s ease}
@keyframes heartPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes heartSwing{0%{transform:rotate(0)}25%{transform:rotate(360deg)}50%{transform:rotate(0)}75%{transform:rotate(-360deg)}100%{transform:rotate(0)}}
@keyframes starOrbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes starTwinkle{0%,100%{opacity:.4}50%{opacity:1}}
.rw-big{position:relative;display:block;width:120px;height:120px;margin:8px auto;border:0;background:none;padding:0}
.rw-big .rw-spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:heartSwing 4s ease-in-out infinite}
.rw-big .rw-pulse{font-size:84px;line-height:1;animation:heartPulse 1s ease-in-out infinite}
.rw-big .rw-orbit{position:absolute;inset:0;animation:starOrbit 6s linear infinite}
.rw-big .rw-star{position:absolute;left:50%;top:50%;font-size:20px;margin:-10px 0 0 -10px;transform:rotate(var(--a)) translate(62px) rotate(calc(var(--a) * -1));animation:starTwinkle 1.2s ease-in-out infinite}
.feedback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:90px;z-index:50;animation:pop .9s forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:0}}
/* ===== القصص والألعاب ===== */
.story-line{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px;margin:8px 0;border:3px solid transparent;transition:.2s}
.story-line.on{border-color:var(--pri);background:var(--soft)}
.story-line .e{font-size:40px;min-width:70px;text-align:center}
.story-line .t{font-size:26px;font-family:"Traditional Arabic","Amiri","Noto Naskh Arabic",serif;line-height:1.6}
.hunt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hcell{border:0;border-radius:16px;height:70px;background:#fff;box-shadow:0 3px 0 var(--line);font-size:40px;font-family:"Traditional Arabic","Amiri",serif;color:var(--ink)}
.hcell.found{background:#d9f6e6;color:var(--ok);pointer-events:none}
.hcell.miss{background:#ffe0de;animation:shake .35s}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{border:0;border-radius:16px;height:82px;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.mcard.open,.mcard.done{background:#fff;color:var(--ink);border:3px solid var(--line)}
.mcard.done{border-color:var(--ok);background:#e9fbf1}
.code-box{font-family:monospace;font-size:22px;background:var(--soft);padding:12px;border-radius:12px;direction:ltr;word-break:break-all;user-select:all}
/* ===== صفحة ولي الأمر ===== */
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px;margin-bottom:10px}
.tabs button{flex:0 0 auto;border:0;border-radius:12px;padding:9px 12px;background:var(--soft);color:var(--pri);font-weight:700;font-size:14px}
.tabs button.on{background:var(--pri);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{background:#fdf2f7;font-weight:800}
.tbl-wrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.kpi{background:#fdf2f7;border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px;color:var(--pri)}
.kpi span{font-size:12px;color:var(--muted)}
.bar{height:9px;background:#eee;border-radius:6px;overflow:hidden;min-width:60px}
.bar>span{display:block;height:100%;background:var(--ok)}
.bar.pri>span{background:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:12px;font-size:15px;font-weight:700}
.lgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.lbtn{border:2px solid var(--line);background:#fff;border-radius:10px;font-size:24px;padding:6px 0;font-family:"Traditional Arabic","Amiri",serif;color:var(--ink)}
.lbtn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.lbtn.off{opacity:.3}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:8px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rec{padding:8px 10px;border-radius:12px;background:#fdf6fa;margin:6px 0;font-size:15px}
/* قائمة الأطفال في صفحة ولي الأمر: اسم في كل سطر */
.child-pick{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.child-pick button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;font-weight:700;color:var(--ink);width:100%;text-align:right}
.child-pick button.on{border-color:var(--pri);background:var(--soft)}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.chk{display:inline-flex;gap:6px;align-items:center;margin-inline-end:12px;font-weight:700}
.chk input{width:auto}
/* ===== النافذة المنبثقة والتنبيه ===== */
.modal{position:fixed;inset:0;background:rgba(70,20,45,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.mbox{background:#fff;border-radius:22px;padding:20px;max-width:440px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.mbody{margin:10px 0 16px;font-size:17px}
.mbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#45293a;color:#fff;padding:10px 18px;border-radius:14px;z-index:120;font-size:15px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#printArea{display:none}
/* ===== الطباعة ===== */
@media print{
  #app,#modal,#toast{display:none!important}
  #printArea{display:block!important;color:#000}
  body{background:#fff}
  .pb{page-break-before:always}
  .card{box-shadow:none;border:1px solid #ccc}
}
.ph{text-align:center;border-bottom:2px solid #999;padding-bottom:6px;margin-bottom:10px}
.ws-row{display:flex;gap:6px;align-items:center;margin:6px 0;border-bottom:1px solid #bbb;padding-bottom:4px}
.ws-model{font-size:54px;width:70px;text-align:center;font-family:"Traditional Arabic","Amiri",serif;color:#000}
.ws-trace{font-size:54px;width:70px;text-align:center;font-family:"Traditional Arabic","Amiri",serif;color:#cfcfcf}
.ws-empty{width:70px;height:70px;border-bottom:2px solid #444;border-left:1px dashed #ccc}
.ws-word{font-size:40px;font-family:"Traditional Arabic","Amiri",serif;min-width:120px;text-align:center}
.ws-word.t{color:#cfcfcf}
.ws-line{flex:1;height:60px;border-bottom:2px solid #444}
.cert{border:10px double var(--pri);border-radius:24px;padding:30px 20px;text-align:center;min-height:85vh;display:flex;flex-direction:column;justify-content:center}
.cert h1{font-size:40px;color:var(--pri)}
.cert .nm{font-size:44px;color:var(--pri);font-weight:800;margin:10px 0}
.mrow{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 30px;font-size:26px;font-family:Arial,sans-serif;direction:ltr;margin:16px 0}
@media (max-width:420px){.options{grid-template-columns:1fr 1fr}.ar-letter{font-size:48px}.lgrid{grid-template-columns:repeat(6,1fr)}.mem{grid-template-columns:repeat(3,1fr)}}
[hidden]{display:none !important}
.set-head{display:flex;align-items:center;gap:10px}
.set-head h3{margin:0}
.set-menu{display:flex;flex-direction:column;gap:6px}
.set-item{display:block;width:100%;text-align:right;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font:inherit;color:inherit;cursor:pointer}
.set-item.on{background:var(--soft);font-weight:700}
.grp{margin:12px 2px 4px;color:var(--muted);font-size:14px;font-weight:700}

/* ===== التصميم الجديد: تدرجات وردية هادئة، وبطاقات KPI ===== */
:root{--grad:linear-gradient(135deg,#ff9bbd 0%,#e75a8c 55%,#c73f70 100%);--shadow:0 10px 28px rgba(199,63,112,.13);--shadow-hover:0 14px 34px rgba(199,63,112,.20)}
body{background:radial-gradient(900px 480px at 100% -8%,#ffe3ee 0,transparent 60%),radial-gradient(800px 460px at -8% 108%,#fff0d9 0,transparent 55%),var(--bg)}
html.dark body{background:var(--bg)}
h2{font-weight:900;color:var(--ink);letter-spacing:.2px}
.card{border-radius:24px;box-shadow:var(--shadow);border:1px solid rgba(231,90,140,.10);padding:18px}
.hero{border-radius:28px;background:var(--grad);color:#fff;border:0;box-shadow:0 14px 34px rgba(199,63,112,.30);padding:24px 14px}
.hero h1{color:#fff;font-size:27px;text-shadow:0 2px 10px rgba(120,20,60,.18)}
.hero .muted{color:rgba(255,255,255,.92)}
.btn{border-radius:16px;background:var(--grad);box-shadow:0 8px 18px rgba(199,63,112,.25);transition:transform .12s,box-shadow .12s}
.btn:hover{box-shadow:0 10px 22px rgba(199,63,112,.32)}
.btn.ghost{background:#fff;color:var(--pri);box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid var(--line)}
.btn.ok{background:linear-gradient(135deg,#43c58a,#2fa36b);box-shadow:0 8px 18px rgba(47,163,107,.25)}
.btn.danger{background:linear-gradient(135deg,#f0716b,#e2554f);box-shadow:0 8px 18px rgba(226,85,79,.25)}
input,select,textarea{border-radius:14px;border:1.5px solid var(--line);padding:12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px rgba(231,90,140,.15)}
.big-tile{border-radius:24px;background:#fff;box-shadow:0 8px 22px rgba(199,63,112,.10);border:1px solid rgba(231,90,140,.10);transition:transform .15s,box-shadow .15s}
.big-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.big-tile .em{width:64px;height:64px;margin:0 auto 8px;border-radius:20px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:32px}
.big-tile.main{background:var(--grad);color:#fff}
.big-tile.main .em{background:rgba(255,255,255,.22)}
/* البطاقات التي هي روابط (منصات خارجية) تُعرض بنفس وسط البطاقات الأخرى بلا خط تحتها */
a.big-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:var(--ink)}
.pill{background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.kids .kid{border-radius:26px}
/* بطاقات KPI */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.kpi{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow);border:1px solid rgba(231,90,140,.10);display:flex;align-items:center;gap:12px;min-width:0}
.kpi .ico{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:25px;background:var(--soft);flex:0 0 auto}
.kpi .v{font-size:26px;font-weight:900;color:var(--ink);line-height:1.1;font-family:Arial,sans-serif}
.kpi .l{font-size:13px;color:var(--muted);font-weight:700;margin-top:3px}
.kpi.c1 .ico{background:#ffe3ee}.kpi.c2 .ico{background:#fff1cc}.kpi.c3 .ico{background:#d9f6e6}.kpi.c4 .ico{background:#dff3ff}
.kpi .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.kpi .bar>div{height:100%;background:var(--grad);border-radius:6px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.kpi-row .kpi{flex-direction:column;align-items:flex-start;text-align:start}
.set-head{display:flex;align-items:center;gap:10px}
.set-menu .set-item{border-radius:14px}
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:6px 0 14px}
.set-card{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid var(--line,#eadfe6);border-radius:16px;background:#fff;text-align:right;cursor:pointer;transition:transform .15s,box-shadow .15s}
.set-card.on{background:var(--soft,#fdf2f7);border-color:var(--hl,#2563eb)}
.set-card:hover,.set-card:focus-visible{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08);outline:none}
.set-ico{font-size:26px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:rgba(0,0,0,.04);flex:none}
.set-txt{flex:1;display:flex;flex-direction:column;gap:2px}
.set-txt b{font-size:15px}
.set-txt small{font-size:12px;opacity:.7}
.set-go{font-size:20px;opacity:.5}
.set-hero{margin-bottom:8px}
.set-hero h3{margin:0 0 4px}
.set-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.set-bar-t{flex:1;min-width:150px}
.set-bar-t h3{margin:0}
.set-bar-t small{display:block;font-size:12px}
.dash-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.dsum{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;border:1px solid rgba(0,0,0,.06)}
.dsum b{display:block;font-size:22px}
.dsum span{font-size:12px;opacity:.7}
.dsum.warn{border-color:#f0b429}
.dsum.bad{border-color:#e35d5d}
.dash-alert{border-inline-start:4px solid #f0b429}
.dash-alert div{padding:3px 0;font-size:14px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.dash-card{background:var(--card);border-radius:18px;padding:14px;border-top:6px solid var(--kc,#e75a8c);box-shadow:0 4px 16px rgba(120,40,80,.08)}
.dash-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dash-top h3{margin:0;font-size:17px}
.dash-av{font-size:30px;line-height:1}
.dash-meta{font-size:13px;margin:6px 0}
.dash-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
@media (max-width:520px){.dash-sum{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:22px}.kpi .ico{width:42px;height:42px;font-size:21px}}

/* ===== الكؤوس وقائمة الفائزين ===== */
.cup-shelf{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}
.cup{background:linear-gradient(135deg,#fff7d6,#ffe39a);border-radius:18px;padding:10px 12px;text-align:center;box-shadow:0 6px 16px rgba(240,165,49,.25);min-width:84px}
.cup-ico{font-size:34px;display:block;line-height:1.2}
.cup small{font-weight:800;color:#7a5200}
.cup-row{margin:12px 0}
.cup-row .bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:6px}
.cup-row .bar>div{height:100%;background:var(--grad);border-radius:8px}
#brand{position:sticky;top:0;z-index:60;text-align:center;font-weight:800;font-size:15px;padding:8px 10px;background:var(--grad);color:#fff;letter-spacing:.3px}
.env-btn{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:999px;border:none;background:#fff;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);display:grid;place-items:center}
.env-btn[hidden]{display:none}
.back-btn{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:999px;border:none;background:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);display:grid;place-items:center}
.back-btn[hidden]{display:none}
.env-btn .env-pill{position:absolute;top:-4px;inset-inline-end:-4px;background:#e35d5d;color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:1px 6px;line-height:1.4}

:root{--pri:#d64f80;--ink:#2b1f2a;--muted:#7a6670;--line:#eedfe6;--bg:#fbf7f9;--r:18px}

body{background:var(--bg)}
.btn{background:var(--pri);background-image:none;box-shadow:0 1px 2px rgba(43,31,42,.12);border-radius:14px;font-weight:700;letter-spacing:.2px}
.btn:hover{filter:brightness(1.03)}
.btn.ok{background:#2f8f63}
.btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--line);box-shadow:none}
.card{border-radius:20px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(43,31,42,.04),0 8px 24px rgba(43,31,42,.06)}
.hero{background:var(--pri);border:0;border-radius:22px;box-shadow:0 8px 24px rgba(214,79,128,.22)}

#brand{background:var(--pri);box-shadow:0 1px 0 rgba(0,0,0,.04)}

input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(214,79,128,.15)}

// نسخة احتياطية تلقائية قبل كل تحديث للتطبيق، ونستعيدها إن تعذّرت قراءة البيانات
const BACKUP_KEY = STORE_KEY + '_autobackup';
// التحميل من IndexedDB (المخزن الأساسي). إن لم توجد بيانات فيه نقرأ localStorage مرة واحدة (ترحيل من الإصدارات السابقة)
async function loadState(){
  let raw = null, legacy = false;
  try { raw = await idbGet('state_main'); } catch (e) {}
  if (!raw) { try { raw = localStorage.getItem(STORE_KEY); legacy = !!raw; } catch (e) {} }
  if (raw) {
    try {
      const d = JSON.parse(raw), prev = (d.settings && d.settings.appVersion) || 'old';
      // نسخة احتياطية تلقائية قبل كل تحديث للتطبيق
      if (prev !== APP_VERSION) await idbPut('state_autobackup', JSON.stringify({version: prev, at: Date.now(), data: raw})).catch(() => {});
      d.settings = d.settings || {}; d.settings.appVersion = APP_VERSION;
      return {state: migrate(d), legacy};
    } catch (e) {
      try {
        const b = JSON.parse((await idbGet('state_autobackup').catch(() => null)) || localStorage.getItem(BACKUP_KEY) || 'null');
        if (b && b.data) return {state: migrate(JSON.parse(b.data)), legacy};
      } catch (e2) {}
      try {
        const dd = JSON.parse((await idbGet('state_daily').catch(() => null)) || 'null');
        if (dd && dd.data) return {state: migrate(JSON.parse(dd.data)), legacy};
      } catch (e3) {}
    }
  }
  return {state: migrate(defaultState()), legacy: false};
}

function migrate(d){
  const def = defaultState();
  d.settings = Object.assign({}, def.settings, d.settings || {});
  if (!Array.isArray(d.children) || !d.children.length) d.children = def.children;
  d.children = d.children.map(c => Object.assign(newChild(c.id, c.name, c.emoji, c.color), {addMax:c.mathMax || 10, subMax:c.mathMax || 10}, c));
  d.children.forEach(c => { if (c.strictOrder === undefined) c.strictOrder = c.id === 'yamama'; if (c.autoLevel === undefined) c.autoLevel = false; if (c.enRoutine === undefined) c.enRoutine = false; });
  if (!Array.isArray(d.words)) d.words = def.words;
  d.words.forEach(w => { w.lang = w.lang || (/[A-Za-z]/.test(w.w) && !/[ء-ي]/.test(w.w) ? 'en' : 'ar'); w.kids = w.kids || []; w.target = w.target || []; });
  d.notes = d.notes || []; d.progress = d.progress || {}; d.comps = d.comps || [];
  d.kcontent = Array.isArray(d.kcontent) ? d.kcontent : [];
  d.yt = Array.isArray(d.yt) ? d.yt : [];
  d.adhkar = Array.isArray(d.adhkar) ? d.adhkar : DEFAULT_ADHKAR.map(a => ({id:uid(), ...a, visible:true, approved:false}));
  // كل الأذكار تحتاج موافقة ولي الأمر؛ الأذكار القديمة بلا حقل الموافقة تبدأ معلّقة
  d.adhkar.forEach(a => { if (a.approved === undefined) a.approved = false; });
  // قائمة السور المعتمدة لولي الأمر (افتراضياً فارغة)
  if (!Array.isArray(d.quranApproved)) d.quranApproved = [];
  return d;
}

function scanMessages(){
  if (!READY) return;
  const items = [];
  (S.inbox || []).forEach(m => {
    items.push({key: 'n:' + m.id, m, kind: 'new'}); // كل الرسائل: من الأطفال، وطلبات تجديد الوكلاء، وطلبات التفعيل
    (m.replies || []).forEach((r, i) => items.push({key: 'r:' + m.id + ':' + i, m, kind: 'reply'}));
  });
  broadcasts().forEach(b => items.push({key: 'b:' + b.id, m: b, kind: 'bc'})); // التعميمات تصل إلى الأطفال
  if (MSG_SEEN === null) { MSG_SEEN = new Set(items.map(x => x.key)); return; } // أول تحميل: لا إشعار للقديم
  const fresh = items.filter(x => !MSG_SEEN.has(x.key));
  items.forEach(x => MSG_SEEN.add(x.key));
  if (!fresh.length) return;
  if (UI.parentOk) {
    if (UI.parentRole === 'guardian' && !agentAllows('reports')) return;
    const n = fresh.filter(x => x.kind === 'new' && !x.m.read && msgVisible(x.m)).pop();

  }
}

// ===== المزامنة عبر Google Drive =====
// كل بيانات البرنامج (القصص والملفات والإعدادات والتقدم) تُحفظ في ملف واحد داخل
// "مجلد بيانات التطبيق" المخفي في Drive، ولا يراه غير هذا التطبيق (نطاق drive.appdata)
const DRIVE_KEY = 'academyDrive_v1';          // يحفظ معرّف العميل فقط
const DRIVE_FILE = 'academy-data.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.metadata.readonly https://www.googleapis.com/auth/drive.file';
const LOCAL_AT_KEY = 'academyLocalAt';         // وقت آخر تعديل محلي (ميلي ثانية)
const DRIVE = { on:false, clientId:'', token:null, tokenExp:0, client:null, fileId:null,
  timer:null, poll:null, listening:false, last:0, resolve:null, reject:null,
  device: localStorage.getItem('academyDevice') || (() => { const v = uid(); localStorage.setItem('academyDevice', v); return v; })() };
function localAt(){ return +(localStorage.getItem(LOCAL_AT_KEY) || 0); }
function setLocalAt(t){ try { localStorage.setItem(LOCAL_AT_KEY, String(t)); } catch (e) {} }
function loadScript(src){ return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('تعذّر تحميل مكتبة Google')); document.head.appendChild(el); }); }
// تهيئة عميل تسجيل الدخول من Google (يتطلب أن يعمل البرنامج من رابط https)
async function driveInit(){
  if (!window.google || !google.accounts) await loadScript('https://accounts.google.com/gsi/client');
  DRIVE.client = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE.clientId, scope: DRIVE_SCOPE,
    callback: r => { if (DRIVE.resolve) { DRIVE.resolve(r); DRIVE.resolve = DRIVE.reject = null; } },
    error_callback: e => { if (DRIVE.reject) { DRIVE.reject(new Error(e.type || 'تعذّر تسجيل الدخول')); DRIVE.resolve = DRIVE.reject = null; } }
  });
}
// mode: 'silent' بدون نافذة (للمزامنة الخلفية)، 'interactive' يفتح نافذة الدخول (يحتاج ضغطة زر)
async function driveAuth(mode){
  if (DRIVE.token && Date.now() < DRIVE.tokenExp) return;
  if (!DRIVE.client) await driveInit();
  const r = await new Promise((res, rej) => {
    DRIVE.resolve = x => x.error ? rej(new Error(x.error)) : res(x);
    DRIVE.reject = rej;
    DRIVE.client.requestAccessToken({prompt: mode === 'silent' ? 'none' : ''});
  });
  DRIVE.token = r.access_token; DRIVE.tokenExp = Date.now() + (r.expires_in - 60) * 1000;
}
// طلب إلى Drive مع رمز الدخول الحالي
async function gfetch(url, opts = {}){
  await driveAuth('silent');
  const r = await fetch(url, {...opts, headers: {...(opts.headers || {}), Authorization: 'Bearer ' + DRIVE.token}});
  if (r.status === 401) { DRIVE.token = null; throw new Error('انتهت الجلسة، اضغطي المزامنة لتسجيل الدخول'); }
  if (!r.ok) throw new Error('خطأ من Drive: ' + r.status);
  return r;
}
async function findFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILE}'`);
  const j = await (await gfetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`)).json();
  return j.files && j.files[0] ? j.files[0].id : null;
}
// قراءة الملف السحابي (null إذا لم يُنشأ بعد)
async function readRemote(){
  if (!DRIVE.fileId) DRIVE.fileId = await findFile();
  if (!DRIVE.fileId) return null;
  return (await gfetch(`https://www.googleapis.com/drive/v3/files/${DRIVE.fileId}?alt=media`)).json();
}
// كتابة الملف السحابي: تحديث إن وُجد، وإلا إنشاء داخل مجلد بيانات التطبيق
async function writeRemote(payload){
  const body = JSON.stringify(payload);
  if (!DRIVE.fileId) DRIVE.fileId = await findFile();
  if (DRIVE.fileId) {
    await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${DRIVE.fileId}?uploadType=media`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body});
  } else {
    const boundary = 'academy' + uid();
    const meta = JSON.stringify({name: DRIVE_FILE, parents: ['appDataFolder']});
    const multipart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
    const r = await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {method:'POST', headers:{'Content-Type': `multipart/related; boundary=${boundary}`}, body: multipart});
    DRIVE.fileId = (await r.json()).id;
  }
}
// دمج البيانات القادمة من جهاز آخر: تُقبل فقط إذا كانت أحدث من نسختي المحلية
function applyRemote(doc){
  if (!doc || typeof doc.json !== 'string') return;
  if ((doc.at || 0) <= localAt()) return;
  try {
    keepPrev(JSON.stringify(S));   // نسخة احتياطية قبل الاستبدال
    S = migrate(JSON.parse(doc.json));
    persistNow(JSON.stringify(S)); setLocalAt(doc.at);
    applyTheme();
    if (UI.parentOk) renderParent();
    toast('☁️ وصلت تحديثات من الجهاز الآخر');
  } catch (e) { console.warn('drive: bad remote data', e); }
}
// المزامنة الكاملة: إن كانت السحابة أحدث نسحب، وإن كانت محليّتنا أحدث نرفع
async function driveSync(){
  if (!DRIVE.clientId) return;
  const doc = await readRemote();
  if (doc && (doc.at || 0) > localAt()) { applyRemote(doc); DRIVE.last = Date.now(); return; }
  if (!doc || localAt() > (doc.at || 0)) {
    const at = Date.now();
    await writeRemote({json: JSON.stringify(S), at, from: DRIVE.device});
    setLocalAt(at);
  }
  DRIVE.last = Date.now();
}
// بعد كل حفظ محلي: مزامنة بعد 3 ثوانٍ لتجميع التعديلات المتقاربة
function driveSoon(){
  if (!DRIVE.on) return;
  clearTimeout(DRIVE.timer);
  DRIVE.timer = setTimeout(() => driveSync().catch(e => console.warn('drive sync failed', e)), 3000);
}
// مزامنة دورية كل دقيقة، وعند عودة البرنامج للظهور (مهم على الآيباد)
function startPolling(){
  clearInterval(DRIVE.poll);
  DRIVE.poll = setInterval(() => { if (DRIVE.on && !document.hidden) driveSync().catch(e => console.warn(e)); }, 60000);
  if (!DRIVE.listening) {
    DRIVE.listening = true;
    document.addEventListener('visibilitychange', () => { if (DRIVE.on && !document.hidden) driveSync().catch(e => console.warn(e)); });
  }
}
// عند فتح البرنامج: إن كانت المزامنة مفعّلة سابقاً نحاول الدخول بصمت
async function driveBoot(){
  const saved = JSON.parse(localStorage.getItem(DRIVE_KEY) || 'null');
  if (!saved || !saved.clientId) return;
  DRIVE.clientId = saved.clientId;
  try {
    await driveAuth('silent');
    DRIVE.on = true; await driveSync(); startPolling(); renderHome();
  } catch (e) { console.warn('drive: silent sign-in unavailable, use manual sign-in from the tab', e); }
}
// رقم السورة من اسم ملف التلاوة، مثل 91.mp3 أو 091 - الناس.m4a (يُقبل فقط 1 إلى 114)
function surahNumberFromName(name){
  const m = name.match(/^\s*0*(\d{1,3})\b/), n = m ? +m[1] : 0;
  return /\.(mp3|m4a)$/i.test(name) && n >= 1 && n <= 114 ? n : 0;
}
// حفظ التلاوة الكاملة للسورة محلياً (Cache API) لتشغيلها بدون إنترنت
async function driveSaveQuran(id, n){
  const blob = await driveDownload(id);
  const c = await caches.open('academy-drive-quran');
  await c.put('/drive-quran/' + n, new Response(blob, {headers: {'Content-Type': blob.type || 'audio/mpeg'}}));
}
// رابط تشغيل التلاوة الكاملة للسورة إن كانت محفوظة
async function driveFullAudio(n){
  try {
    const c = await caches.open('academy-drive-quran');
    const r = await c.match('/drive-quran/' + n);
    return r ? URL.createObjectURL(await r.blob()) : null;
  } catch (e) { return null; }
}
// قائمة ملفات مجلد المحتوى (الاسم من الإعدادات) داخل Drive
async function driveListFolder(){
  const name = S.settings.driveFolder || 'أكاديمية';
  const fq = encodeURIComponent(`name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const f = await (await gfetch(`https://www.googleapis.com/drive/v3/files?q=${fq}&fields=files(id,name)`)).json();
  if (!f.files || !f.files[0]) throw new Error(`لم يُعثر على مجلد باسم "${name}"`);
  const q2 = encodeURIComponent(`'${f.files[0].id}' in parents and trashed=false`);
  return (await (await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q2}&fields=files(id,name)&pageSize=200`)).json()).files || [];
}
// تنزيل محتوى ملف من Drive كـ Blob
async function driveDownload(id){ return (await gfetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).blob(); }

// ===== الرابط السحابي: بيانات الأكاديمية على خادم Vercel، ليدخل الطفل من أي جهاز عبر الرابط =====
const CLOUD_API = '/api/family', CLOUD_MAX = 900 * 1024;
const JOIN_API = '/api/join'; // رمز دخول قصير للموقع يربط الجهاز بالعائلة
let CLOUD_TIMER = null, CLOUD_POLL = null, CLOUD_LISTENING = false;
const cloudLink = f => location.origin + location.pathname + '?f=' + f;
// المزامنة بالإصدارات (_v) لا بتوقيت الجهاز: ساعات الأجهزة المختلفة لا تؤثر فيها
// CLOUD_DIRTY = في الجهاز تعديل لم يُرفع بعد
let CLOUD_DIRTY = false;
let CLOUD_SNAP = null; // لقطة آخر حالة رُفعت أو طُبّقت من الخادم (بلا الإصدار والرابط)
const cloudSnapshot = () => { const o = Object.assign({}, S); delete o._v; delete o.cloud; return JSON.stringify(o); };
const cloudVKey = () => 'academyCloudV:' + ((S.cloud && S.cloud.f) || '');
const cloudV = () => +(localStorage.getItem(cloudVKey()) || 0);
const setCloudV = (v, f) => { try { localStorage.setItem('academyCloudV:' + (f || (S.cloud && S.cloud.f) || ''), String(v || 0)); } catch (e) {} };
function cloudSoon(){
  if (!S.cloud || !S.cloud.f) return;
  if (CLOUD_SNAP !== null && cloudSnapshot() === CLOUD_SNAP) return; // لا تغيير في البيانات: لا مزامنة
  CLOUD_DIRTY = true;
  clearTimeout(CLOUD_TIMER);
  CLOUD_TIMER = setTimeout(() => cloudPush().catch(() => cloudRetry()), 1500);
}
// فشل الرفع التلقائي (انقطاع مثلاً): نعيد المحاولة كل 20 ثانية دون إزعاج
function cloudRetry(){
  clearTimeout(CLOUD_TIMER);
  CLOUD_TIMER = setTimeout(() => cloudPush().catch(() => cloudRetry()), 20000);
}
// يجلب نسخة الخادم: يُرجع البيانات أو null إن لم توجد
async function cloudGet(){
  const r = await fetch(CLOUD_API + '?f=' + encodeURIComponent(S.cloud.f));
  if (r.status === 404) return null;
  if (!r.ok) { const err = new Error('get'); err.status = r.status; throw err; }
  return JSON.parse(await r.text());
}
// يطبّق نسخة الخادم الأحدث على هذا الجهاز، ويحتفظ بالرابط المحلي
function cloudApply(d){
  try {
    keepPrev(JSON.stringify(S));
    const link = S.cloud, f = link.f;
    S = migrate(d); S.cloud = link;
    persistNow(JSON.stringify(S)); setCloudV(d._v || 0, f); CLOUD_SNAP = cloudSnapshot();
    applyTheme();
    if (UI.parentOk) renderParent();
    else if (UI.kid && !document.querySelector('input:focus, textarea:focus')) renderChild(UI.kid);
    // شاشة الدخول لا تُعاد رسمها تلقائياً، فنعيدها إن كانت الشاشة الحالية (دون مقاطعة الكتابة)
    else if ((CUR === renderLogin || CUR === null) && !document.querySelector('input:focus, textarea:focus')) renderLogin();
    toast('☁️ وصلت تحديثات من الجهاز الآخر');
    scanMessages(); // رسائل وصلت من الجهاز الآخر
  } catch (e) { console.warn('cloud: bad remote data', e); }
}
// سحب دوري: يطبّق الخادم إن كان له إصدار أحدث، ولا يسحب والتعديل المحلي لم يُرفع بعد
async function cloudPull(){
  if (!S.cloud || !S.cloud.f || CLOUD_DIRTY) return;
  const d = await cloudGet();
  if (d && (d._v || 0) > cloudV()) cloudApply(d);
}
// يبدأ السحب الدوري كل 30 ثانية، وعند عودة البرنامج للظهور
function startCloudPolling(){
  clearInterval(CLOUD_POLL);
  if (!S.cloud || !S.cloud.f) return;
  CLOUD_POLL = setInterval(() => { if (!document.hidden) cloudPull().catch(() => {}); }, 30000);
  if (!CLOUD_LISTENING) {
    CLOUD_LISTENING = true;
    document.addEventListener('visibilitychange', () => { if (!document.hidden && S.cloud && S.cloud.f) cloudPull().catch(() => {}); });
  }
}
// الرفع: إن كان للخادم إصدار أحدث ولا تعديل محلي معلّق نسحبه بدل الكتابة فوقه
async function cloudPush(){
  if (!S.cloud || !S.cloud.f) return false;
  const remote = await cloudGet();
  const rv = remote ? (remote._v || 0) : 0;
  // الخادم أحدث: نطبّق نسخته ولا نكتب فوقها بنسخة قديمة، حتى لو كان عندنا تعديل بسيط لم يُرفع
  // (التعديل المحلي يبقى في «استعادة النسخة السابقة»)
  if (remote && rv > cloudV()) { cloudApply(remote); return true; }
  const v = Math.max(rv, cloudV()) + 1;
  const snap = cloudSnapshot();
  S._v = v;
  const body = JSON.stringify(S);
  if (body.length > CLOUD_MAX) { toast('حجم البيانات أكبر من الحد المسموح للرابط'); return false; }
  CLOUD_DIRTY = false; // أي تعديل يحدث أثناء الرفع يعيد العلامة
  let r;
  try {
    try { r = await fetch(CLOUD_API + '?f=' + encodeURIComponent(S.cloud.f), {method: 'PUT', headers: {'Content-Type': 'application/json'}, body}); }
    catch (e) { const err = new Error('network'); err.kind = 'network'; throw err; }
    if (!r.ok) {
      // نقرأ سبب الخطأ من الخادم (إن وُجد) ليظهر للمستخدمة بدل رسالة عامة
      let why = ''; try { why = (await r.json()).error || ''; } catch (e) {}
      const err = new Error(why || ('status ' + r.status)); err.status = r.status; throw err;
    }
  } catch (e) { CLOUD_DIRTY = true; throw e; }
  setCloudV(v); CLOUD_SNAP = snap;
  return true;
}
// يحوّل خطأ الرفع إلى سبب مفهوم بالعربية
function cloudErrText(e){
  if (e && e.kind === 'network') return 'لا يوجد اتصال بالإنترنت';
  if (e && e.status === 503) return 'التخزين السحابي غير مربوط بالمشروع في Vercel';
  if (e && e.status === 404) return 'ملف الخادم api/family غير منشور، تحققي من النشر';
  if (e && e.status) return (e.message || 'خطأ في الخادم') + ' (رمز ' + e.status + ')';
  return e && e.message ? e.message : 'سبب غير معروف';
}
// إن كان في الرابط معرّف عائلة تُحمَّل البيانات منه؛ يُرجع البيانات أو false
async function cloudPullFromLink(){
  const f = new URLSearchParams(location.search).get('f');
  if (!f || !/^[a-f0-9]{32}$/.test(f)) return false;
  const r = await fetch(CLOUD_API + '?f=' + encodeURIComponent(f));
  if (!r.ok) { toast(r.status === 404 ? 'لم تُرفع بيانات لهذا الرابط بعد' : 'تعذّر الاتصال بالخادم'); return false; }
  const d = migrate(JSON.parse(await r.text()));
  d.cloud = {f};
  return d;
}
// طلبات رمز الدخول للموقع
async function joinApi(body){
  const r = await fetch(JOIN_API, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'تعذّر الاتصال بالخادم');
  return d;
}
// يربط الجهاز بالعائلة برمز الدخول: يُحمَّل بيانات العائلة كما يفعل الرابط الكامل
async function joinWithCode(code){
  const d = await joinApi({ action: 'join', code });
  const r = await fetch(CLOUD_API + '?f=' + encodeURIComponent(d.f));
  if (!r.ok) throw new Error('تعذّر تحميل بيانات الموقع');
  const data = migrate(JSON.parse(await r.text()));
  data.cloud = { f: d.f };
  S = data; persistNow(JSON.stringify(S)); setCloudV(data._v || 0, d.f); CLOUD_SNAP = cloudSnapshot();
  startCloudPolling();
}

// ربط الحساب بمعرّف العميل المُدخل (يُستدعى من الإعدادات)
async function driveConnect(id){
  try {

  const explicitFocus = child.focus && child.focus.length > 0;
  const pl = plainLetters(w.w);
  if (!pl.length) return false;
  if (!explicitFocus) return isDecodable(w, child.arLetters);
  if (pl.length < 2 || pl.length > 4) return false;

  if (!pl.some(l => focus.includes(l))) return false;

}

function allResults(cid){ const out = []; for (const s of P(cid).sessions) for (const r of (s.results || [])) out.push(r); Object.defineProperty(out, 'cid', {value: cid}); return out; } // cid غير قابل للتعداد: يُستخدم لتطبيق تعديل ولي الأمر
function computeStatus(rs){
  if (!rs.length) return 'new';
  const last = rs.slice(-12), n = last.length;
  const ind = last.filter(r => r.r === 'i').length / n;
  const bad = rs.slice(-5).filter(r => r.r === 'x').length;
  // الخطة 2.2: 5 محاولات تقييمية على الأقل، ودقة 80٪، ونجاح في جلستين على الأقل،
  // وإجابتان بالكتابة أو الترتيب أو السحب على الأقل (الاختيار من متعدد قد يكون تخميناً)
  const okSessions = new Set(last.filter(r => r.r === 'i').map(sessKey)).size;
  const prodCorrect = last.filter(r => r.r === 'i' && prodOK(r)).length;
  if (rs.length >= MIN_EVAL && bad >= 3) return 'support';
  if (n >= MIN_EVAL && ind >= MASTER_ACC && okSessions >= 2 && prodCorrect >= 2) return 'mastered';
  if (n >= MIN_EVAL && ind >= 0.7) return 'near';
  return 'learning';
}
const MIN_EVAL = 5, MASTER_ACC = 0.8;
const prodOK = r => r.ty !== 'choice';            // النتائج القديمة بلا نوع تُعامل كإنتاجية

  const ov = rs.cid !== undefined ? (P(rs.cid).overrides || {})[skill] : null; // تعديل ولي الأمر يتقدم على الحساب
  return ov || computeStatus(rs.filter(r => r.s === skill));
};
// «متقنة بتميّز» = متقنة مع ثبات: 10 محاولات على الأقل، ودقة 90٪، وثلاثة أنواع أسئلة، وثلاث جلسات ناجحة
function isAdvanced(rs, skill){
  const mine = rs.filter(r => r.s === skill), last = mine.slice(-12);
  if (last.length < 10 || computeStatus(mine) !== 'mastered') return false;

  const types = new Set(last.map(r => r.ty || '?')).size;
  const sessions = new Set(last.filter(r => r.r === 'i').map(sessKey)).size;
  return acc >= 0.9 && types >= 3 && sessions >= 3;

function letterDistractors(t, L, n){

  const add = arr => { for (const x of arr) { if (out.length >= n) break; if (x !== t && !out.includes(x)) out.push(x); } };
  add(sim.filter(x => L.includes(x)).slice(0, 2)); add(shuffle(L.filter(x => x !== 'ا' || t === 'ا'))); add(sim.slice(0, 1)); add(shuffle(AR_LETTERS));

}
function enDistractors(t, L, n){

  const add = arr => { for (const x of arr) { if (out.length >= n) break; if (x !== t && !out.includes(x)) out.push(x); } };
  add(sim.filter(x => L.includes(x)).slice(0, 2)); add(shuffle(L)); add(sim); add(shuffle(EN_LETTERS));

const longDivSteps = (a, f) => {
  const D = String(a), F = String(f), n = D.length, P = F.length + 3, sp = x => ' '.repeat(Math.max(0, x));
  let cur = 0, k = -1; const qd = [], lines = [];
  for (let j = 0; j < n; j++) {
    cur = cur * 10 + +D[j];
    if (k < 0 && cur < f) continue;          // الخانات الأولى لا تكفي للقسمة بعد
    if (k < 0) { k = j; lines.push(sp(P + k) + '?'.repeat(n - k)); }
    const q = Math.floor(cur / f), p = q * f, rem = cur - p, end = P + j;
    qd.push(q);
    lines.push(sp(end - String(p).length + 1) + p);
    lines.push(sp(end - String(cur).length + 1) + '-'.repeat(String(cur).length));
    lines.push(sp(end - String(rem).length + 1) + rem);
    cur = rem;
  }
  const head = [F + ' ) ' + D];
  return {text: [...lines.slice(0, 1), ...head, ...lines.slice(1)].join('\n'), qd, rem: cur};
};

// ===== محرك الجلسة =====
let RUN = null;
const WORD_SKILLS = ['ar_blend','ar_word_meaning','ar_read_aloud','ar_dictation','ar_spelling'];
function makeCtx(child, comp){
  const F = (RUN && RUN.onlyLetters) || focusOf(child);
  let words = childWords(child, comp ? STARTER_OBJ : null);
  if (!comp && child.focus && child.focus.length) { const fw = words.filter(w => plainLetters(w.w).some(l => F.includes(l))); if (fw.length >= 2) words = fw; }
  const hlL = w => (child.focus && child.focus.length) ? F : (w.target && w.target.length ? w.target : []);
  return {child, L:child.arLetters, F, words, comp, hlL};
}
function makeQuestion(skill){
  const child = RUN.child, ctx = makeCtx(child, !!RUN.comp);
  const prefix = WORD_SKILLS.includes(skill) ? 'W:' : skill + ':';
  let targets = (!RUN.comp && !RUN.fast && Math.random() < 0.45) ? dueTargets(child.id, prefix).filter(k => !RUN.used.has(k)) : [];
  for (let tries = 0; tries < 10; tries++) {
    const target = targets.length ? targets.shift().slice(prefix.length) : null;
    let q = null;
    try { q = GEN[skill](ctx, target); } catch (e) { console.error(skill, e); }
    if (!q) { if (target) continue; return null; }
    if (RUN.used.has(q.key) && tries < 9) continue;
    q.skill = skill; RUN.used.add(q.key);
    return q;
  }
  return null;
}
// ===== مستوى الطفل =====
// 1 = مبتدئة، 2 = متوسطة، 3 = متقدمة. الافتراضي: ريما 3 وغيرها 1 (يمكن تغييره من الإعدادات)
// المستوى الخام 1-5 (مبتدئ، متوسط، ماهر، متقدم، خبير)، وكل مستوى له نطاق أعداد
const LEVEL_LABELS5 = ['المستوى الأول', 'المستوى الثاني', 'المستوى الثالث', 'المستوى الرابع', 'المستوى الخامس'];
const LEVEL_MATH = [10, 30, 50, 100, 200];
function levelRaw(c){ return c.level || (c.id === 'rima' ? 3 : 1); }
// تقسيم التمارين الحالي يعتمد على المستويات 1-3 فقط
function kidLevel(c){ return Math.min(levelRaw(c), 5); }
// نطاق المستويات لكل تمرين [أدنى، أعلى]؛ التمارين غير المذكورة متاحة للجميع
// تتبع الحروف للمبتدئة فقط، والقصص والجمل للمتوسطة فما فوق
const SKILL_LEVELS = {

  ar_letter_pos: 1,
  ar_match: 1,

// قراءة الترويسة (frontmatter) بين سطري ---: العنوان والوصف فقط
function parseFrontmatter(text){
  const meta = {}, m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if (!m) return {meta, body: text};
  m[1].split(/\r?\n/).forEach(line => { const i = line.indexOf(':'); if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim(); });
  return {meta, body: text.slice(m[0].length)};
}
// تحويل Markdown بسيط: عناوين واقتباس وقوائم وكود؛ أسطر HTML والـ CSS والـ JS تبقى كما هي
function mdInline(s){ return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>'); }
function mdToHtml(text){
  const out = []; let inList = false, inCode = false, inRaw = false;
  const closeList = () => { if (inList) { out.push('</ul>'); inList = false; } };
  for (const line of text.split(/\r?\n/)) {
    const t = line.trim();
    if (inCode) { if (t.startsWith('```')) { out.push('</code></pre>'); inCode = false; } else out.push(esc(line)); continue; }
    if (t.startsWith('```')) { closeList(); out.push('<pre><code>'); inCode = true; continue; }
    if (inRaw) { out.push(line); if (/<\/(style|script)>/i.test(line)) inRaw = false; continue; }
    if (/<(style|script)[\s>]/i.test(line)) { closeList(); out.push(line); if (!/<\/(style|script)>/i.test(line)) inRaw = true; continue; }
    const h = t.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeList(); const n = h[1].length; out.push(`<h${n}>${mdInline(esc(h[2]))}</h${n}>`); continue; }
    if (t.startsWith('> ')) { closeList(); out.push(`<blockquote>${mdInline(esc(t.slice(2)))}</blockquote>`); continue; }
    if (/^[-*]\s+/.test(t)) { if (!inList) { out.push('<ul>'); inList = true; } out.push(`<li>${mdInline(esc(t.replace(/^[-*]\s+/, '')))}</li>`); continue; }
    closeList();
    if (!t) continue;
    if (t.startsWith('<')) { out.push(line); continue; } // HTML يمر كما هو
    out.push(`<p>${mdInline(esc(t))}</p>`);
  }
  closeList(); if (inCode) out.push('</code></pre>');
  return out.join('\n');
}
// يبني مستند الصفحة الكامل: ملف HTML يُستخدم كما هو، وMarkdown يُحوَّل
function buildPageDoc(name, text){
  const base = name.replace(/\.[^.]+$/, '');
  if (/\.html?$/i.test(name)) {
    const t = (text.match(/<title>([\s\S]*?)<\/title>/i) || [])[1];
    return {title: (t || base).trim(), desc: '', doc: text};
  }
  const {meta, body} = parseFrontmatter(text);
  return {
    title: meta.title || base,
    desc: meta.description || '',
    doc: `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:system-ui,Tahoma,Arial,sans-serif;line-height:1.7}</style></head><body>${mdToHtml(body)}</body></html>`
  };
}

const levelDoneCount = (c, lv) => { const rs = allResults(c.id), list = levelSkills(c, lv); return {done: list.filter(s => skillStatus(rs, s) === 'mastered').length, total: list.length}; };
const levelDone = (c, lv) => { const t = levelDoneCount(c, lv); return t.total > 0 && t.done === t.total; };
const levelOpen = (c, n) => { for (let i = 1; i < n; i++) if (!levelDone(c, i)) return false; return true; };
// شروط الترقية (مشتركة بين الترقية التلقائية واقتراح ولي الأمر)
function levelUpReady(c){
  if (kidLevel(c) >= 5) return false;
  if (!levelDone(c, kidLevel(c))) return false;
  if (levelMasteryShare(c) < 0.6) return false;
  const rs = levelResults(c).slice(-LEVEL_UP.answers);
  if (rs.length < LEVEL_UP.answers) return false;
  const st = stat(rs);
  const days = new Set(rs.filter(r => r.r === 'i').map(r => todayStr(new Date(r.t)))).size;
  return st.ip >= LEVEL_UP.indep && days >= LEVEL_UP.days;
}
function checkLevelUp(c){
  if (!c.autoLevel || !levelUpReady(c)) return 0; // لا انتقال تلقائياً إلا بتفعيل ولي الأمر
  c.level = kidLevel(c) + 1; c.levelSince = Date.now();
  return c.level;
}
// بدون الترقية التلقائية: يُقترح الانتقال ويبقى بانتظار موافقة ولي الأمر (ولا يُعاد عرضه أسبوعين بعد الرفض)
function suggestLevel(c){
  if (c.autoLevel || c.levelSuggest || !levelUpReady(c)) return;
  if (c.levelDismissed && Date.now() - c.levelDismissed < 14 * DAYS_MS) return;
  c.levelSuggest = {to: kidLevel(c) + 1, at: Date.now()};
  toast('💡 هناك اقتراح لترقية المستوى بانتظار موافقة ولي الأمر');
}
function levelSuggestHtml(c){
  const sg = c.levelSuggest; if (!sg || sg.to <= kidLevel(c)) return '';
  return `<div class="card"><h3>💡 اقتراح ترقية المستوى</h3><p>أداء ${esc(kCall(c))} الأخير يشير إلى أنها جاهزة للانتقال إلى مستوى <b>${LEVEL_NAMES[sg.to]}</b>. القرار لوليّ الأمر.</p><div class="row"><button class="btn ok" data-act="acceptLevel" data-id="${esc(c.id)}">✅ قبول الترقية</button><button class="btn ghost" data-act="dismissLevel" data-id="${esc(c.id)}">ليس الآن</button></div></div>`;
}
// روتين الإنجليزية اليومي حسب المستوى (تقريباً ٤٥ دقيقة): استماع ← مفردات ← قراءة ← كتابة ← تحدث

    ['المفردات', [['en_initial',2], ['en_letter_name',2]]],

  ],

    ['المفردات', [['en_words',3], ['en_initial',2]]],
    ['القراءة', [['en_sent_order',2], ['en_words',2]]],
    ['الكتابة', [['en_missing',3], ['en_cvc',2]]],
    ['التحدث', [['en_say',3]]]
  ],
  3: [
    ['الاستماع', [['en_talk',3], ['en_vocab',2]]],
    ['المفردات', [['en_words',2], ['en_vocab',2]]],
    ['القراءة', [['en_sent_order',3], ['en_match',1]]],
    ['الكتابة', [['en_missing',3]]],
    ['التحدث', [['en_say',3]]]

};
// روتين الإنجليزية لمن فعّل ولي الأمر خيار "روتين الإنجليزية اليومي" (لا يتأثر بجدول الأيام العربي)
function buildEnglishRoutine(child){
  const lv = kidLevel(child), blocks = EN_ROUTINE[Math.min(lv, 3)] || EN_ROUTINE[1];
  const queue = [], parts = [];
  blocks.forEach(([name, skills]) => {
    let total = 0;
    skills.forEach(([s, n]) => { for (let i = 0; i < n; i++) queue.push(s); total += n; });
    parts.push([name, total]);
  });
  return {queue, title:'روتين الإنجليزية اليومي — ' + LEVEL_NAMES[lv], day:P(child.id).dayIndex % 7 + 1, parts};
}
function buildDailyQueue(child){
  if (child.enRoutine) return buildEnglishRoutine(child);
  const p = P(child.id), day = p.dayIndex % 7, plan = DAY_PLANS[day], rs = allResults(child.id);
  // درس جديد: تمارين اليوم (أو تمارين المراجعة الأسبوعية)
  let learn;
  if (plan.review) {
    const weak = Object.keys(SKILLS).map(s => ({s, st:skillStatus(rs, s), n:rs.filter(r => r.s === s).length}))
      .filter(o => o.n > 0 && o.st !== 'mastered').sort((a, b) => STATUS_ORDER[a.st] - STATUS_ORDER[b.st]).slice(0, 6);
    learn = weak.length ? weak.map(o => [o.s, 3]) : [['ar_letter_sound',4],['ar_harakat',3],['ar_blend',3],['en_letter_name',3],['m_count',3]];
    learn.push(['ar_sentence',2], ['ar_comprehension',1]);
  } else {
    learn = plan.items.slice();
    const sup = Object.keys(SKILLS).find(s => skillStatus(rs, s) === 'support');
    if (sup) learn.push([sup, 2]);
  }
  // الضرب والقسمة: يُضافان إلى أيام الرياضيات إذا كانا مفعّلين لهذا الطفل
  if ((plan.items || []).some(([x]) => x.startsWith('m_'))) ['m_mul', 'm_div'].forEach(x => { if (skillEnabled(child, x) && !learn.some(y => y[0] === x)) learn.push([x, 2]); });
  // تصفية التمارين حسب مستوى الطفل
  learn = learn.filter(([s]) => skillAllowed(child, s) && !skillLocked(child, s));
  if (!learn.length) learn = [['ar_letter_sound', 4], ['ar_read_aloud', 3]];
  // مراجعة الأخطاء: أكثر ثلاث مهارات أخطاءً (أو احتاجت مساعدة) في آخر ٤٠ إجابة
  const misses = {};
  rs.slice(-40).forEach(r => { if (r.r !== 'i') misses[r.s] = (misses[r.s] || 0) + 1; });
  // المراجعة المستحقة (حسب فاصل الحالة) أولاً، ثم أخطاء آخر ٤٠ إجابة، دون تكرار المهارة
  const due = dueSkills(child.id).filter(o => skillAllowed(child, o.s) && !skillLocked(child, o.s)).slice(0, 2).map(o => [o.s, 2]);
  const dueSet = new Set(due.map(x => x[0]));
  const missList = Object.entries(misses).filter(([s]) => SKILLS[s] && !dueSet.has(s) && skillAllowed(child, s) && !skillLocked(child, s))
    .sort((a, b) => b[1] - a[1]).slice(0, Math.max(1, 3 - due.length)).map(([s]) => [s, 2]);
  const review = [...due, ...missList];
  // اختبار ختامي: مهارتان من درس اليوم أتقنتهما أو قاربتِ على إتقانهما
  let test = learn.filter(([s]) => ['mastered', 'near'].includes(skillStatus(rs, s))).slice(0, 2).map(([s]) => [s, 2]);
  if (!test.length) test = learn.slice(0, 1).map(([s]) => [s, 2]);
  const items = [...review, ...learn, ...test];
  const queue = []; items.forEach(([s, n]) => { for (let i = 0; i < n; i++) queue.push(s); });
  // أجزاء الدرس لعرضها للطفل: مراجعة ← درس جديد ← اختبار ختامي
  const parts = [['مراجعة', review], ['درس جديد', learn], ['اختبار ختامي', test]]
    .filter(([, x]) => x.length).map(([n, x]) => [n, x.reduce((a, [, k]) => a + k, 0)]);
  return {queue, title:plan.t, day:day + 1, parts};
}

// إبقاء الشاشة نشطة أثناء الجلسة (Wake Lock)، ويُعاد طلبها عند العودة للتطبيق
let WAKE = null;
async function keepAwake(on){
  try {
    if (!('wakeLock' in navigator)) return;
    if (on) { if (!WAKE) WAKE = await navigator.wakeLock.request('screen'); }
    else if (WAKE) { await WAKE.release(); WAKE = null; }
  } catch (e) { WAKE = null; }
}
document.addEventListener('visibilitychange', () => { if (RUN && !document.hidden) keepAwake(true); });
function startRun(child, queue, opts = {}){
  breakTick();

  P(child.id).sessions.push(session);
  RUN = Object.assign({child, queue, idx:0, session, used:new Set(), elapsed:0, limit:opts.fast ? 60 : (child.minutes === 0 ? Infinity : (child.minutes || 30) * 60), earned:0, score:0, breakShown:false, timeShown:false}, opts);
  RUN.timer = setInterval(tick, 1000);

  RUN.hintsUsed = 0; RUN.hintMax = (RUN.comp || RUN.fast) ? HINT_BASE : hintAllowance();
  keepAwake(true);

function tick(){
  if (!RUN || document.hidden) return;
  RUN.elapsed++; RUN.session.dur = RUN.elapsed;
  const el = $('#tmr'); if (el) el.textContent = timerText();
  if (RUN.fast && RUN.elapsed >= RUN.limit) { finishRun(); return; }
  if (RUN.guided && !RUN.breakShown && RUN.elapsed >= RUN.limit / 2) { RUN.breakShown = true; modal('استراحة حركة 🤸', 'قفي، تمددي، واقفزي ٥ مرات… ثم نكمل!', [{label:'هيا نكمل 💪', val:1}]); }
  if (RUN.guided && !RUN.timeShown && RUN.elapsed >= RUN.limit) {
    RUN.timeShown = true;
    modal('انتهى وقت اليوم 🎉', 'أحسنتِ! أكملتِ وقت الجلسة.', [{label:'إنهاء الجلسة', val:'end', cls:'ok'}, {label:'أكمل قليلاً', val:'more', cls:'ghost'}]).then(r => { if (r.v === 'end') finishRun(); });
  }
}
function timerText(){
  const t = ((RUN.guided || RUN.fast) && isFinite(RUN.limit)) ? RUN.limit - RUN.elapsed : RUN.elapsed, a = Math.abs(t);
  return (t < 0 ? '+' : '') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0');
}
function nextQuestion(){
  while (RUN) {
    // التدريب المفتوح (له pool): عند نفاد الأسئلة تبدأ دورة جديدة من المهارات حتى ينتهي الوقت أو تخرج الطفل
    if (RUN.idx >= RUN.queue.length) {
      if (!RUN.pool || (RUN.nulls || 0) > 50) break;
      RUN.queue.push(...shuffle(RUN.pool));
    }
    let q = RUN.preset ? RUN.preset[RUN.idx] : makeQuestion(RUN.queue[RUN.idx]);
    // بعد خطأين في البند نفسه يتغيّر نمط السؤال من الاختيار إلى السحب (الاقتراح 3)
    if (q && !RUN.preset && !RUN.comp && !RUN.fast && q.type === 'choice' && q.options && (RUN.strikes || {})[q.key] >= 2) q = choiceToOrder(q);
    if (q) { RUN.nulls = 0; Object.assign(RUN, {q, wrong:0, hinted:false, resolved:false, picked:[], msel:null, matched:new Set(), qStart:Date.now()}); renderQuestion(); return; }
    RUN.nulls = (RUN.nulls || 0) + 1;
    RUN.idx++;
  }
  finishRun();
}
// ----- المرحلة الثالثة: المراجعة المستحقة، ودرجة الكتابة، والنسخة الداخلية -----
// فاصل المراجعة حسب حالة المهارة: الدعم الآن، والقريبة بعد ٣ أيام، والمتقنة بعد أسبوع
const SKILL_GAP_DAYS = {support: 0, learning: 1, near: 3, mastered: 7, advanced: 10};
// المهارات المستحقة للمراجعة: مرّ على آخر تدريب عليها فاصلها الزمني، والأولوية للأضعف
function dueSkills(cid){
  const rs = allResults(cid), now = Date.now(), out = [];
  Object.keys(SKILLS).forEach(s => {
    const mine = rs.filter(r => r.s === s); if (!mine.length) return;
    const st = displayStatus(rs, s), gap = SKILL_GAP_DAYS[st] !== undefined ? SKILL_GAP_DAYS[st] : 1;
    const overdue = (now - mine[mine.length - 1].t) / DAYS_MS - gap;
    if (overdue >= 0) out.push({s, st, overdue});
  });
  return out.sort((a, b) => (STATUS_ORDER[a.st] - STATUS_ORDER[b.st]) || (b.overdue - a.overdue));
}
// درجة تطابق الكتابة (٠ إلى ١٠٠): نقارن الحبر بقناع الحرف المرسوم بالخط نفسه، مع تسامح بمسافة صغيرة
// التغطية = نسبة الحرف الذي امتلأ بالحبر (وزنها ٧٠٪)، والدقة = نسبة الحبر الواقع على الحرف (وزنها ٣٠٪)
function traceScore(text, ink, w, h){
  const mk = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const g = mk(), gx = g.getContext('2d');
  const size = text.length > 1 ? Math.min(h * 0.6, w / (text.length * 0.55)) : h * 0.75;
  gx.font = `${size}px "Traditional Arabic","Amiri","Noto Naskh Arabic","Times New Roman",serif`;
  gx.textAlign = 'center'; gx.textBaseline = 'middle'; gx.fillStyle = '#000'; gx.fillText(text, w / 2, h * 0.5);
  const R = Math.max(5, Math.round(size * 0.04)); // تسامح صغير: الخط المرسوم بالإصبع لا يطابق الحرف بدقة البكسل
  const dil = src => { const d = mk(), dx = d.getContext('2d'); for (let x = -R; x <= R; x += 2) for (let y = -R; y <= R; y += 2) dx.drawImage(src, x, y); return dx.getImageData(0, 0, w, h).data; };
  const glyph = gx.getImageData(0, 0, w, h).data, inkData = ink.getContext('2d').getImageData(0, 0, w, h).data;
  const glyphNear = dil(g), inkNear = dil(ink);
  let gTot = 0, gHit = 0, iTot = 0, iHit = 0;
  for (let i = 3; i < glyph.length; i += 4) {
    if (glyph[i] > 60) { gTot++; if (inkNear[i] > 60) gHit++; }
    if (inkData[i] > 60) { iTot++; if (glyphNear[i] > 60) iHit++; }
  }
  if (iTot < 30 || gTot === 0) return 0; // خط قصير جداً لا يُقيَّم
  const cov = gHit / gTot, prec = iHit / iTot;
  return Math.round(100 * (0.7 * cov + 0.3 * prec)); // التغطية أهم: الحرف الناقص لا يُعدّ متقناً
}
function traceNote(sc){

}

// رمز الاسترداد: يُعرض مرة واحدة، ويُخزَّن منه تجزئة SHA-256 فقط
async function sha256hex(s){

  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');

async function makeRecovery(){
  const alph = 'abcdefghjkmnpqrstuvwxyz23456789', rnd = crypto.getRandomValues(new Uint8Array(12));
  const raw = [...rnd].map(x => alph[x % alph.length]).join('');
  S.settings.recHash = await sha256hex(raw); save();
  return raw.replace(/(.{4})(?=.)/g, '$1-');
}

  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
async function encryptBackup(text, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveBackupKey(pass, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text));
  return {encrypted:true, formatVersion:2, kdf:'PBKDF2-SHA256', salt:b64enc(salt), iv:b64enc(iv), data:b64enc(new Uint8Array(ct))};
}
async function decryptBackup(d, pass){
  const key = await deriveBackupKey(pass, b64dec(d.salt));

  return new TextDecoder().decode(pt);
}

const MEDIA_PREFIXES = ['rec_', 'chat_', 'adhkar_audio_', 'pdf_', 'page_', 'wimg_']; // الملفات التي تُحفظ في IndexedDB وتدخل النسخة
function idbEntries(prefixes){
  return idbOpen().then(db => new Promise((res, rej) => {
    const kr = db.transaction('store').objectStore('store').getAllKeys();
    kr.onerror = () => rej(kr.error);
    kr.onsuccess = () => {
      const keys = kr.result.filter(k => typeof k === 'string' && prefixes.some(p => k.startsWith(p)));
      const out = {}; let left = keys.length;
      if (!left) return res(out);
      keys.forEach(k => {
        const g = db.transaction('store').objectStore('store').get(k);
        g.onerror = () => rej(g.error);
        g.onsuccess = () => { out[k] = g.result; if (--left === 0) res(out); };
      });
    };
  }));
}

  const r = await fetch(EMAIL_API + '?action=' + action, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));

}

let CUR_CID = null; // الطفل المعروض الآن، لاختيار صوتها
// ===== المراسلة بين الأطفال والتعميم من مدير النظام =====
// الرسائل تُحفظ في بيانات التطبيق (وتتزامن مع Google Drive إن كان مربوطاً)، وتُحذف تلقائياً بعد 48 ساعة
const CHAT_KEEP_MS = 48 * 60 * 60 * 1000, CHAT_MAX_VOICE_MS = 30000; // 48 ساعة، والتسجيل الصوتي حتى 30 ثانية
let CHAT_REC = null;
const chatState = () => (S.chat = S.chat || {msgs: [], seen: {}}, S.chat);
const broadcasts = () => (S.broadcasts = S.broadcasts || []);
const dmRoom = (a, b) => 'dm:' + [a, b].sort().join('|');
const seenKey = (cid, room) => cid + '|' + room;
// المراسلة الخاصة تُتاح تلقائياً بين الأطفال المسندين إلى ولي أمر واحد فقط
const siblingsOf = (a, b) => agents().some(g => g.kids.includes(a) && g.kids.includes(b));
const dmKids = id => S.children.filter(k => k.id !== id && !k.chatOff && siblingsOf(id, k.id));
// مراسلة الطفل مع ولي أمره (الوكيل النشط المسنَد إليه)؛ الغرفة خاصة بينهما
const guardRoomsOf = cid => agents().filter(a => a.kids.includes(cid) && isActive(a)).map(a => ({room: dmRoom(cid, a.id), label: '👤 ' + a.name}));
// الغرفة متاحة للطفل إن كانت التعميمات، أو المجموعة لمن أضافه المدير إليها، أو خاصة مع أخ مسند لنفس ولي الأمر، أو مع ولي أمره
const roomAllowed = (cid, room) => {
  const c = CH(cid); if (!c || c.chatOff) return false;
  if (room === 'broadcast') return true;
  if (room === 'group') return !!c.inGroup;
  return dmKids(cid).some(k => dmRoom(cid, k.id) === room) || guardRoomsOf(cid).some(g => g.room === room);
};
// حذف الرسائل والتعميمات الأقدم من 48 ساعة، مع تفريغ تسجيلاتها الصوتية
// الصوت على الجهاز يُحذف مع الرسالة، أما نسخته في السحابة فتُحذف بعد 24 ساعة
async function chatPrune(){
  const cut = Date.now() - CHAT_KEEP_MS, st = chatState();
  const old = st.msgs.filter(m => m.at < cut), oldB = broadcasts().filter(b => b.at < cut);
  if (!old.length && !oldB.length) return;
  for (const m of old) if (m.vk) await idbDel(m.vk).catch(() => {});
  for (const b of oldB) if (b.vk) await idbDel(b.vk).catch(() => {});
  st.msgs = st.msgs.filter(m => m.at >= cut);
  S.broadcasts = broadcasts().filter(b => b.at >= cut);
  save();
}
// ===== الرسائل الصوتية: تُحفظ على الجهاز الذي سجّلها، وتُرفع إلى السحابة ليسمعها الجهاز الآخر =====
const VOICE_MAX_B64 = 400 * 1024; // نفس الحد في api/family.js
const blobToB64 = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });
const b64ToBlob = (b64, type) => { const bin = atob(b64), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], {type: type || 'audio/webm'}); };
// يرفع الصوت بمفتاح الرسالة (vk)؛ يرجع false إن لم يكن الرابط السحابي مفعّلاً أو تعذّر الرفع
async function voiceUpload(vk, blob){
  if (!S.cloud || !S.cloud.f) return false;
  const d = await blobToB64(blob);
  if (d.length > VOICE_MAX_B64) return false;
  const r = await fetch(CLOUD_API + '?f=' + encodeURIComponent(S.cloud.f) + '&v=' + encodeURIComponent(vk), {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({d, t: blob.type})});
  return r.ok;
}
// يجلب الصوت من السحابة إلى هذا الجهاز إذا لم يكن موجوداً محلياً
async function voiceFetch(vk){
  if (!S.cloud || !S.cloud.f) return null;
  const r = await fetch(CLOUD_API + '?f=' + encodeURIComponent(S.cloud.f) + '&v=' + encodeURIComponent(vk));
  if (!r.ok) return null;
  const o = JSON.parse(await r.text());
  const blob = b64ToBlob(o.d || '', o.t);
  await idbPut(vk, blob).catch(() => {});
  return blob;
}
// تسجيل رسالة صوتية (للمراسلة والتعميم معاً): يحفظ الصوت ثم يستدعي onSaved(vk)، ويستدعي onChange عند البدء والانتهاء
async function recordVoice(onSaved, onChange){
  if (CHAT_REC) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast('التسجيل غير مدعوم في هذا المتصفح');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch (e) { return toast('اسمحي للمتصفح بالوصول إلى الميكروفون'); }
  const chunks = [], mr = new MediaRecorder(stream, recOpts());
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    clearTimeout(CHAT_REC && CHAT_REC.timer); stream.getTracks().forEach(tr => tr.stop()); CHAT_REC = null;
    const blob = new Blob(chunks, {type: mr.mimeType || 'audio/webm'}), vk = 'chat_' + Date.now().toString(36);
    try {
      await idbPut(vk, blob);
      onSaved(vk); save(); toast('تم إرسال الرسالة الصوتية 🎙️');
      voiceUpload(vk, blob).then(ok => { if (!ok && S.cloud && S.cloud.f) toast('تعذّر رفع الصوت، لن يسمعه الجهاز الآخر'); })
        .catch(() => toast('تعذّر رفع الصوت، لن يسمعه الجهاز الآخر'));
    } catch (e) { toast('تعذّر حفظ الرسالة الصوتية'); }
    onChange();
  };
  const timer = setTimeout(() => { if (CHAT_REC && CHAT_REC.mr.state !== 'inactive') CHAT_REC.mr.stop(); }, CHAT_MAX_VOICE_MS);
  mr.start(); CHAT_REC = {mr, timer}; onChange();
}

// عدد الرسائل غير المقروءة للطفل: من المجموعة، ومن رسائلها الخاصة، ومن التعميمات
function chatUnread(cid){
  const me = CH(cid); if (!me || me.chatOff) return 0;
  const st = chatState(); let n = 0;
  const rooms = [...(me.inGroup ? ['group'] : []), ...dmKids(cid).map(k => dmRoom(cid, k.id)), ...guardRoomsOf(cid).map(g => g.room)];
  for (const r of rooms) { const since = st.seen[seenKey(cid, r)] || 0; n += st.msgs.filter(m => m.room === r && m.from !== cid && m.at > since).length; }
  const bs = st.seen[seenKey(cid, 'broadcast')] || 0;
  return n + broadcasts().filter(b => b.at > bs).length;
}

const QURAN_RECITERS = [['ar.husary','الحصري (مرتّل)'],['ar.minshawi','المنشاوي (مرتّل)'],['ar.minshawimujawwad','المنشاوي (مجوّد)'],['ar.alafasy','مشاري العفاسي']];

const QURAN_ALT = {};
function idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open('academyQuran', 1); r.onupgradeneeded = () => r.result.createObjectStore('store'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ const db = await idbOpen(); return new Promise((res, rej) => { const q = db.transaction('store').objectStore('store').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbDel(k){ const db = await idbOpen(); return new Promise((res, rej) => { const t = db.transaction('store', 'readwrite'); t.objectStore('store').delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }

async function idbPut(k, v){ const db = await idbOpen(); return new Promise((res, rej) => { const t = db.transaction('store', 'readwrite'); t.objectStore('store').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function quranList(){
  let l = null; try { l = await idbGet('list'); } catch (e) {}
  if (l) return l;
  l = (await (await fetch(`${QURAN_API}/surah`)).json()).data;
  try { await idbPut('list', l); } catch (e) {}
  return l;
}
// نص السورة وروابط صوتها للقارئ المختار؛ إن تعذّر القارئ يُجرَّب البقية
async function quranSurah(n, pref){
  const known = r => QURAN_RECITERS.some(x => x[0] === r);
  const want = known(pref) ? pref : known(S.settings.quranReciter) ? S.settings.quranReciter : QURAN_RECITERS[0][0];
  const order = [want, ...QURAN_RECITERS.map(r => r[0]).filter(r => r !== want)];
  for (const rec of order) {
    for (const ed of (QURAN_ALT[rec] || [rec])) {
      const key = 'surah_' + ed + '_' + n;
      let d = null; try { d = await idbGet(key); } catch (e) {}
      if (d) return {...d, reciter: rec};
      try {
        const js = (await (await fetch(`${QURAN_API}/surah/${n}/editions/quran-uthmani,${ed}`)).json()).data;
        if (!js || js.length < 2) continue;
        const audio = js[1].ayahs.map(a => a.audio);
        if (!audio.every(Boolean)) continue;
        d = {name:js[0].name, reciter:ed, text:js[0].ayahs.map(a => a.text), audio};
        try { await idbPut(key, d); } catch (e) {}
        return {...d, reciter: rec};
      } catch (e) { continue; }
    }
  }
  throw new Error('تعذّر تحميل السورة');
}

async function qSrc(url){
  try {
    const c = await caches.open('academy-quran-audio');
    let r = await c.match(url);
    if (!r) { r = await fetch(url); if (r.ok) c.put(url, r.clone()); }
    return URL.createObjectURL(await r.blob());
  } catch (e) { return url; }
}

// يضيف ولي الأمر القناة، وتظهر فيديوهاتها للأطفال، ويستطيع إخفاء أي فيديو
// بدون مفتاح API: تُجلب الفيديوهات من خلاصة القناة (RSS) إن سمح المتصفح، وإلا تُلصق الروابط يدوياً
// كود خدمة Google Apps Script لعرضه في صفحة ولي الأمر للنسخ
const YT_SCRIPT_CODE = String.raw`// خدمة جلب فيديوهات يوتيوب لأكاديمية أبو نصره
// تُرجع JSON للمتصفح: الفيديوهات حسب معرّف القناة، أو معرّف القناة حسب المعرّف @

function doGet(e) {
  const p = e.parameter;
  try {
    // جلب فيديوهات قناة بمعرّفها UC
    if (p.channel_id) return json({ videos: feedVideos(p.channel_id) });
    // تحويل المعرّف @ إلى معرّف UC
    if (p.handle) return json({ channel_id: handleToChannel(p.handle) });
    return json({ error: 'missing parameter' });
  } catch (err) {
    return json({ error: String(err) });
  }
}

// إرجاع الرد بصيغة JSON
function json(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

// قراءة الخلاصة الرسمية للقناة (آخر الفيديوهات)
function feedVideos(cid) {
  const url = 'https://www.youtube.com/feeds/videos.xml?channel_id=' + encodeURIComponent(cid);
  const xml = UrlFetchApp.fetch(url, { muteHttpExceptions: true }).getContentText();
  const root = XmlService.parse(xml).getRootElement();
  const atom = XmlService.getNamespace('http://www.w3.org/2005/Atom');
  const yt = XmlService.getNamespace('yt', 'http://www.youtube.com/xml/schemas/2015');
  return root.getChildren('entry', atom).map(entry => ({
    id: entry.getChild('videoId', yt).getText(),
    title: entry.getChild('title', atom).getText()
  }));
}

// استخراج معرّف القناة من صفحة المعرّف @
function handleToChannel(handle) {
  const h = handle.startsWith('@') ? handle : '@' + handle;
  const html = UrlFetchApp.fetch('https://www.youtube.com/' + encodeURIComponent(h), {
    muteHttpExceptions: true, followRedirects: true
  }).getContentText();
  const m = html.match(/"channelId":"(UC[\w-]{20,})"/) || html.match(/channel_id=(UC[\w-]{20,})/);
  if (!m) throw new Error('channel not found');
  return m[1];
}`;
function ytChannelId(input){
  const m = String(input || '').match(/UC[\w-]{20,}/);
  return m ? m[0] : null;
}
// دمج فيديوهات جديدة مع القائمة الحالية دون تكرار أو حذف
function ytMerge(ch, fresh){
  const have = new Set(ch.videos.map(v => v.id));
  fresh.forEach(v => { if (!have.has(v.id)) { ch.videos.push({...v, show:true}); have.add(v.id); } });
  save();
}
async function ytFetchVideos(cid){
  // إن وُضع رابط Google Apps Script في الإعدادات نجلب عبره (يتجاوز قيود المتصفح)
  if (S.settings.ytScript) {
    const j = await (await fetch(`${S.settings.ytScript}?channel_id=${encodeURIComponent(cid)}`)).json();
    if (j.error) throw new Error(j.error);
    return j.videos || [];
  }
  // يوتيوب لا يسمح بالطلب المباشر من المتصفح (CORS)، فنجرّب مسارات بديلة بالترتيب
  const feed = `https://www.youtube.com/feeds/videos.xml?channel_id=${encodeURIComponent(cid)}`;
  const routes = [feed, `https://api.allorigins.win/raw?url=${encodeURIComponent(feed)}`, `https://corsproxy.io/?${encodeURIComponent(feed)}`];
  let lastErr = new Error('تعذّر الجلب');
  for (const u of routes) {
    try {
      const r = await fetch(u);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const xml = await r.text();
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      if (!doc.getElementsByTagName('feed').length) throw new Error('ليست خلاصة فيديوهات');
      // أخذ معرّف الفيديو وعنوانه من كل مدخل في الخلاصة
      return [...doc.getElementsByTagName('entry')].map(e => ({
        id: (e.getElementsByTagNameNS('*', 'videoId')[0] || {}).textContent || '',
        title: (e.getElementsByTagName('title')[0] || {}).textContent || ''
      })).filter(v => v.id);
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

  if (navigator.share) { try { await navigator.share({title: title || 'فيديو', url}); return; } catch (e) { if (e.name === 'AbortError') return; } }
  await copyText(url);
}
