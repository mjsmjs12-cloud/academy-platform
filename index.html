// كل قصة: اسم + ملف PDF مرفوع (في Drive أو على الجهاز) أو رابط
// الملفات المرفوعة تُحفظ في مجلد "قصص مصورة pdf" داخل مجلد المحتوى في Drive
// جلب مجلد باسم معيّن داخل مجلد أب، وإنشاؤه إن لم يكن موجوداً
async function driveFolderId(name, parent){
  const q = encodeURIComponent(`name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false and '${parent}' in parents`);
  const j = await (await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`)).json();
  if (j.files && j.files[0]) return j.files[0].id;
  const r = await gfetch('https://www.googleapis.com/drive/v3/files?fields=id', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, mimeType:'application/vnd.google-apps.folder', parents:[parent]})});
  return (await r.json()).id;
}
// رفع ملف PDF إلى مجلد "قصص مصورة pdf" وإرجاع معرّفه في Drive
async function driveUploadPdf(file, title){
  const root = await driveFolderId(S.settings.driveFolder || 'أكاديمية', 'root');
  const sub = await driveFolderId('قصص مصورة pdf', root);
  const boundary = 'pdf' + uid();
  const meta = JSON.stringify({name: title + '.pdf', parents: [sub]});
  const body = new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: application/pdf\r\n\r\n`, file, `\r\n--${boundary}--`]);
  const r = await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {method:'POST', headers:{'Content-Type': `multipart/related; boundary=${boundary}`}, body});
  return (await r.json()).id;
}
// بيانات ملف القصة: من Drive أو من الجهاز أو من الرابط
async function pdfBytes(st){
  if (st.src === 'drive') return (await driveDownload(st.driveId)).arrayBuffer();
  if (st.src === 'local') { const f = await idbGet('pdf_' + st.id); if (!f) throw new Error('الملف غير موجود على هذا الجهاز'); return f.arrayBuffer(); }
  const r = await fetch(st.url); if (!r.ok) throw new Error('تعذّر تحميل الرابط، قد يمنع الموقع ذلك'); return r.arrayBuffer();
}

// رسم الصفحة الحالية بعرض الشاشة
async function drawPdfPage(){
  const st = UI.pdf; if (!st) return;
  const page = await st.doc.getPage(st.page);
  const box = $('#pdfBox'); if (!box) return;
  const width = Math.min(box.clientWidth || 360, 720);
  const base = page.getViewport({scale: 1}), vp = page.getViewport({scale: width / base.width});
  box.innerHTML = `<div class="row center" style="margin-bottom:6px"><button class="btn sm ghost" data-act="pdfSave">⬇️ حفظ في الهاتف</button><button class="btn sm ghost" data-act="pdfShare">📤 مشاركة</button></div><div class="row center"><button class="btn sm ghost" data-act="pdfNext">▶️</button><span class="pill">${st.page} / ${st.doc.numPages}</span><button class="btn sm ghost" data-act="pdfPrev">◀️</button></div>
    <canvas id="pdfCanvas" style="width:100%;border-radius:12px;background:#fff;margin-top:8px"></canvas>`;
  const cv = $('#pdfCanvas'); cv.width = vp.width; cv.height = vp.height;
  await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
}

function renderQuestion(){
  const q = RUN.q, sk = SKILLS[q.skill], auto = audioAll(RUN.child);
  let body = '';
  if (q.type === 'choice') {
    body = `<div class="options ${q.options.length === 4 || q.options.length === 2 ? 'g2' : ''}" ${q.ltr ? 'dir="ltr"' : ''}>${q.options.map((o, i) => `<button class="opt" data-act="choose" data-i="${i}">${o.html}</button>`).join('')}</div>`;
  } else if (q.type === 'order') {
    body = `<div class="slots" id="slots" dir="${q.dir}"></div>${q.preview ? `<div class="preview" id="preview" dir="${q.dir}"></div>` : ''}
    <div class="tiles" id="tiles" dir="${q.dir}">${q.tiles.map((t, i) => `<button class="tile" data-act="tile" data-i="${i}">${t.html}</button>`).join('')}</div>
    <button class="btn ghost sm" data-act="undoTile">↩️ تراجع</button>`;
  } else if (q.type === 'match') {

  } else if (q.type === 'trace') {
    body = `<canvas id="trace"></canvas><div class="row center" style="margin-top:10px"><button class="btn ghost" data-act="clearTrace">🧽 مسح</button><button class="btn ok" data-act="doneTrace">✅ انتهيت</button></div><div id="rateBox"></div>`;
  } else if (q.type === 'mic') { body = `<div class="row center"><button class="btn ok" data-act="micTry">🎙️ انطقي الآن</button></div><div id="micOut" class="muted center"></div><div id="rateBox"></div>`; } else if (q.type === 'rate') body = rateButtons('read');

  const tools = mathBtn + (RUN.comp || RUN.fast ? '' : `${(q.type === 'choice' || q.type === 'order' || q.type === 'match') ? hintBtn() : ''}`);
  // السؤال الرياضي يُرسم حسب شكل الطفل الحالي (أفقي أو عمودي)
  const qVisual = q.mathParts ? mathExpr(RUN.child, q.mathParts.a, q.mathParts.op, q.mathParts.b, '<span class="blank">?</span>') + q.mathParts.vis : (q.visual || '');
  view().innerHTML = `${playBar()}${RUN.comp || RUN.fast ? '' : rewardBar()}
  <div class="qcard">
    ${RUN.comp ? `<div class="qskill">${avatar(RUN.child, 34)} ${esc(kCall(RUN.child))} — سؤال ${RUN.idx + 1} من ${RUN.queue.length}</div>` : ''}
    <div class="qskill">${sk.em} ${sk.n}</div><div class="qprompt">${esc(q.prompt)}</div>

    <div class="hintbox" id="hintBox"></div><div class="qtools">${tools}</div>

  else if (q.say.length) setTimeout(() => { if (RUN && RUN.q === q) speak(q.say); }, 350);
}

// تشجيع عند الإجابة الصحيحة: تصفيق وبالونات وأشكال تصعد على الشاشة
const CHEER_ICONS = ['👏', '🎈', '⭐', '🔷', '🔶', '🟣', '🎉', '💖', '🟢'];
function cheer(count = 16, icons = CHEER_ICONS){
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'cheer';
    el.textContent = icons[Math.floor(Math.random() * icons.length)];
    el.style.left = (5 + Math.random() * 88) + 'vw';
    el.style.setProperty('--rot', (Math.random() * 120 - 60) + 'deg');
    el.style.setProperty('--dur', (1.4 + Math.random() * 1.2) + 's');
    el.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
}
// صوت تحذير قصير عند الخطأ (نغمة هابطة)
function beepWarn(){
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(330, ac.currentTime); o.frequency.linearRampToValueAtTime(180, ac.currentTime + 0.35);
    g.gain.setValueAtTime(0.12, ac.currentTime); g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.4);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.4);
  } catch (e) {}
}
// عند الخطأ: صوت تحذير ووجه حزين وعبارة تشجيع تهتز لتشجيعها على المحاولة
function wrongFeedback(){

  el.className = 'wrongface';
  el.innerHTML = '😢<div class="encour">حاولي مرة أخرى 💪</div>';

}

// مكافأة القلوب: كل 10 أسئلة محلولة قلب، وعند 30 قلباً يُفعَّل القلب الكبير
const HEART_EVERY = 10, HEARTS_FULL = 30;
// التلميحات: الافتراضي 3 لكل سؤال، +1 لكل 10 نجوم، +2 لكل قلب، والحد الأقصى 10
const HINT_BASE = 3, HINT_MAX = 10;
function hintAllowance(){
  const cid = RUN.child.id, stars = P(cid).stars || 0, hearts = rewardsOf(cid).hearts || 0;
  return Math.min(HINT_MAX, HINT_BASE + Math.floor(stars / 10) + 2 * hearts);
}
// زر التلميح: كل تلميح مستعمل يُفرغ مربعاً من المتبقي
function hintBtn(){
  const max = RUN.hintMax ?? HINT_BASE, used = RUN.hintsUsed || 0, left = Math.max(0, max - used);
  const marks = '💡'.repeat(left) + '⚪'.repeat(used);
  return `<button class="btn warn sm" data-act="hint" ${left ? '' : 'disabled'}>${marks || '💡'} تلميح (${fmt(left)})</button>`;
}
function rewardsOf(cid){ const pr = P(cid); pr.rewards = pr.rewards || {hearts:0, prog:0}; return pr.rewards; }
function earnHeart(cid){
  const r = rewardsOf(cid);
  r.prog++;
  if (r.prog >= HEART_EVERY) { r.prog = 0; if (r.hearts < HEARTS_FULL) r.hearts++; }
  save();
}
function rewardBar(){
  const r = rewardsOf(RUN.child.id), pct = Math.round(r.prog * 100 / HEART_EVERY), full = r.hearts >= HEARTS_FULL;
  return `<div class="rewardbar">
    <div class="rw-top"><span>❤️ ${fmt(r.hearts)} / ${fmt(HEARTS_FULL)}</span><span class="muted">القلب القادم ${fmt(r.prog)} / ${fmt(HEART_EVERY)}</span></div>
    <div class="rw-track"><div class="rw-fill" style="width:${pct}%"></div></div>
    ${full ? `<button class="rw-big" data-act="heartBurst" aria-label="القلب الكامل"><span class="rw-orbit">${[0, 60, 120, 180, 240, 300].map(a => `<span class="rw-star" style="--a:${a}deg">⭐</span>`).join('')}</span><span class="rw-spin"><span class="rw-pulse">💖</span></span></button>` : ''}
  </div>`;
}
// الانفجار: بالونات كثيرة ورسالة ترحيب وتشجيع، ثم إعادة التعبئة
function heartBurst(){
  cheer(44, ['🎈', '🎈', '🎉', '🎊', '💖', '⭐']);
  const el = document.createElement('div');
  el.className = 'wrongface';
  el.innerHTML = '🎉<div class="encour">مرحباً بكِ يا بطلة! أنتِ رائعة 💖</div>';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
  speak([['برافو يا بطلة! أنتِ رائعة', 'ar']]);
  const r = rewardsOf(RUN.child.id); r.hearts = 0; r.prog = 0; save();
}
function milestone(){
  cheer(26);
  const el = document.createElement('div');
  el.className = 'wrongface';
  el.innerHTML = '🌟<div class="encour">أحسنتِ! استمري 💪</div>';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1400);
}
function burst(ch){ const d = document.createElement('div'); d.className = 'feedback'; d.textContent = ch; document.body.appendChild(d); setTimeout(() => d.remove(), 950); }
function checkOrder(){
  const q = RUN.q; if (RUN.picked.length < q.answer.length) return;
  const vals = RUN.picked.map(i => q.tiles[i].val);
  if (vals.every((v, i) => v === q.answer[i])) { afterResolve(RUN.wrong ? 'x' : RUN.hinted ? 'a' : 'i'); return; }
  RUN.wrong++;
  if (RUN.comp || RUN.fast) { afterResolve('x', 900); return; }
  const sl = $('#slots'); sl.style.animation = 'shake .35s'; speak([['جربي مرة أخرى', 'ar']]); wrongFeedback();
  setTimeout(() => { if (!RUN || RUN.q !== q) return; sl.style.animation = ''; RUN.picked = []; updateSlots(); }, 700);
}
function matchPair(ai, bi){
  const q = RUN.q, A = $$('.mcol')[0].children, B = [...$$('.mcol')[1].children], bBtn = B.find(b => +b.dataset.i === bi);
  if (ai === bi) {
    A[ai].classList.add('done'); bBtn.classList.add('done'); A[ai].classList.remove('sel'); RUN.matched.add(ai); RUN.msel = null;
    speak([[q.pairs[ai].say, q.pairs[ai].lang || 'ar']]);
    if (RUN.matched.size === q.pairs.length) afterResolve(RUN.wrong ? 'x' : RUN.hinted ? 'a' : 'i');
  } else {
    RUN.wrong++; bBtn.classList.add('wrong'); setTimeout(() => bBtn.classList.remove('wrong'), 400);
    if (RUN.comp || RUN.fast) { afterResolve('x', 900); return; }
    speak([['جربي مرة أخرى', 'ar']]); wrongFeedback();
  }
}

// ===== لوحة التتبع (الكتابة بالإصبع) =====
function initCanvas(){
  const cv = $('#trace'), q = RUN.q, dpr = window.devicePixelRatio || 1;
  const w = Math.min(window.innerWidth - 50, 380), h = Math.round(w * 0.78);
  cv.style.width = w + 'px'; cv.style.height = h + 'px'; cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  // طبقة الحبر المنفصلة بالأبعاد المنطقية، لتقييم التطابق مع الحرف دون تأثير الكثافة
  const ink = document.createElement('canvas'); ink.width = w; ink.height = h;
  const ictx = ink.getContext('2d');
  RUN.traceInk = ink; RUN.traceSize = {w, h}; RUN.trace = null;
  RUN.drawGuide = () => {
    ctx.clearRect(0, 0, w, h); ictx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#f6e3ec'; ctx.lineWidth = 2; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(10, h * 0.68); ctx.lineTo(w - 10, h * 0.68); ctx.stroke();
    const size = q.text.length > 1 ? Math.min(h * 0.6, w / (q.text.length * 0.55)) : h * 0.75;
    ctx.font = `${size}px "Traditional Arabic","Amiri","Noto Naskh Arabic","Times New Roman",serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    try { ctx.direction = 'rtl'; } catch (e) {}
    ctx.fillStyle = '#f7ecf2'; ctx.fillText(q.text, w / 2, h * 0.5);
    ctx.setLineDash([7, 6]); ctx.strokeStyle = '#c993ad'; ctx.lineWidth = 2; ctx.strokeText(q.text, w / 2, h * 0.5); ctx.setLineDash([]);
  };
  RUN.drawGuide();
  let drawing = false;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const style = c => { c.strokeStyle = RUN.child.color; c.lineWidth = 11; c.lineCap = 'round'; c.lineJoin = 'round'; };
  cv.onpointerdown = e => { drawing = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); style(ctx); style(ictx); ctx.beginPath(); ctx.moveTo(x, y); ictx.beginPath(); ictx.moveTo(x, y); };
  cv.onpointermove = e => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); ictx.lineTo(x, y); ictx.stroke(); };
  cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
}

function gameSession(){ if (!G) return; clearInterval(G.timer); const dur = Math.round((Date.now() - G.start) / 1000); if (dur > 5) P(G.cid).sessions.push({id:uid(), start:G.start, dur, game:G.type, results:[]}); save(); }
function startHunt(cid, lang){
  rnd = Math.random;
  G = {type:'hunt', cid, lang, score:0, miss:0, left:60, start:Date.now()};
  newHuntRound();
  G.timer = setInterval(() => { if (document.hidden || !G) return; G.left--; const t = $('#gtime'); if (t) t.textContent = G.left; if (G.left <= 0) endHunt(); }, 1000);
}
function newHuntRound(){
  const c = CH(G.cid);
  let target, distract, show = x => x;
  if (G.lang === 'en') {
    const F = enFocus(c); target = pick(F);
    distract = [...(EN_SIMILAR.find(g => g.includes(target)) || []), ...enLetters(c)].filter(x => x !== target);
    if (!distract.length) distract = EN_LETTERS.filter(x => x !== target);
    const low = Math.random() < 0.5; show = x => low ? x.toLowerCase() : x;
  } else {
    const F = focusOf(c); target = pick(F);
    distract = [...(SIMILAR.find(g => g.includes(target)) || []), ...c.arLetters].filter(x => x !== target);
    if (!distract.length) distract = AR_LETTERS.filter(x => x !== target);
  }
  const nT = R(4, 6);
  G.target = target; G.remaining = nT;
  G.cells = shuffle([...Array(nT).fill(target), ...Array.from({length:20 - nT}, () => pick(distract))]).map(v => ({v, s:show(v)}));
  G.show = show(target);
  view().innerHTML = `
  <div class="playbar"><button class="btn ghost sm" data-act="endGame">✖</button><span class="pill">⏱️ <span id="gtime">${G.left}</span></span><span class="pill">🎯 ${G.score}</span></div>
  <div class="qcard"><div class="qprompt">اصطادي كل حرف: <span class="${G.lang === 'en' ? 'en-letter' : 'ar-letter'}" style="color:var(--pri)">${G.show}</span></div>
  <button class="speak-btn small" data-act="huntSay">🔊</button>
  <div class="hunt" style="margin-top:10px" ${G.lang === 'en' ? 'dir="ltr"' : ''}>${G.cells.map((cl, i) => `<button class="hcell" style="${G.lang === 'en' ? 'font-family:Arial' : ''}" data-act="huntTap" data-i="${i}">${cl.s}</button>`).join('')}</div></div>`;
  huntSay();
}
function huntSay(){ speak(G.lang === 'en' ? [['letter ' + G.target, 'en']] : [[letterSound(G.target), 'ar']]); }
function endHunt(){
  if (!G) return; const g = G, p = P(g.cid).games, key = g.lang === 'en' ? 'huntEn' : 'huntAr';
  p[key] = Math.max(p[key] || 0, g.score); gameSession(); G = null;
  modal('انتهت اللعبة 🎉', `اصطدتِ <b>${g.score}</b> حرفاً صحيحاً!<br>أفضل نتيجة: ${p[key]}`, [{label:'العب مرة أخرى', val:'again'}, {label:'رجوع', val:'back', cls:'ghost'}])
    .then(r => r.v === 'again' ? startHunt(g.cid, g.lang) : renderGames(g.cid));
}
function startMemory(cid){
  rnd = Math.random;
  const c = CH(cid), ctx = makeCtx(c, false);
  let pairs = [];
  const W = shuffle(ctx.words.filter(w => w.emoji)).filter((w, i, a) => a.findIndex(x => x.emoji === w.emoji) === i);
  if (W.length >= 4 && Math.random() < 0.6) pairs = W.slice(0, 6).map(w => [`<span class="tw" style="font-size:22px">${esc(w.w)}</span>`, w.emoji, w.w, 'ar']);
  else if (Math.random() < 0.5) pairs = shuffle(focusOf(c).length >= 3 ? focusOf(c) : c.arLetters).slice(0, 6).map(l => [`<span class="ar-letter" style="font-size:38px">${l}</span>`, AR_KEY[l][1], letterSound(l), 'ar']);
  else pairs = shuffle(enFocus(c).length >= 3 ? enFocus(c) : enLetters(c)).slice(0, 6).map(l => [`<span style="font-family:Arial">${l}</span>`, `<span style="font-family:Arial">${l.toLowerCase()}</span>`, 'letter ' + l, 'en']);
  if (pairs.length < 2) { toast('أضيفي حروفاً أكثر للعب'); return; }
  const cards = shuffle(pairs.flatMap((p, i) => [{pid:i, html:p[0], say:p[2], lang:p[3]}, {pid:i, html:p[1], say:p[2], lang:p[3]}]));
  G = {type:'memory', cid, cards, open:[], done:new Set(), moves:0, start:Date.now(), lock:false};
  view().innerHTML = `
  <div class="playbar"><button class="btn ghost sm" data-act="endGame">✖</button><span class="pill">🧠 لعبة الذاكرة</span><span class="pill" id="gmoves">محاولات: 0</span></div>
  <div class="qcard"><div class="qprompt">اقلبي بطاقتين متطابقتين</div><div class="mem">${cards.map((_, i) => `<button class="mcard" data-act="memTap" data-i="${i}">❓</button>`).join('')}</div></div>`;
}
function memTap(i){
  if (!G || G.lock || G.done.has(i) || G.open.includes(i)) return;
  const btn = $$('.mcard')[i], cd = G.cards[i];
  btn.classList.add('open'); btn.innerHTML = cd.html; speak([[cd.say, cd.lang]]);
  G.open.push(i);
  if (G.open.length < 2) return;
  G.moves++; $('#gmoves').textContent = 'محاولات: ' + G.moves;
  const [a, b] = G.open;
  if (G.cards[a].pid === G.cards[b].pid) {
    G.done.add(a); G.done.add(b); $$('.mcard')[a].classList.add('done'); $$('.mcard')[b].classList.add('done'); G.open = [];
    if (G.done.size === G.cards.length) {
      const g = G, p = P(g.cid).games; p.memory = p.memory ? Math.min(p.memory, g.moves) : g.moves; gameSession(); G = null; burst('🏆');
      setTimeout(() => modal('أحسنتِ! 🎉', `أنهيتِ اللعبة في <b>${g.moves}</b> محاولة.<br>أفضل نتيجة: ${p.memory}`, [{label:'العب مرة أخرى', val:'again'}, {label:'رجوع', val:'back', cls:'ghost'}]).then(r => r.v === 'again' ? startMemory(g.cid) : renderGames(g.cid)), 600);
    }

// تجزئة بسيطة مستقرة تعمل في كل المتصفحات (بما فيها الملفات المحلية)، وليست بديلاً عن التشفير
function hashPin(p){
  const salted = p + 'academy-salt';
  let h1 = 0x811c9dc5, h2 = 0x9747b28c;
  for (let i = 0; i < salted.length; i++) { const c = salted.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619) >>> 0; h2 = Math.imul(h2 ^ c, 2246822519) >>> 0; }
  return 'h0:' + h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
}

  const st = S.settings.pin || ''; if (!st) return true;

  return false;
}

// تُحفظ في sessionStorage: تبقى في هذا التبويب فقط وتُمحى بإغلاقه، وتُحفظ مع كل تنقل

const SESSION_KEY = 'academySession';
const PARENT_IDLE_MS = 5 * 60 * 1000;
function saveSession(){
  if (!READY) return; // لا تُكتب الجلسة قبل اكتمال التحميل حتى لا تُمحى قبل قراءتها
  try {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({kid: UI.kid || null, parentOk: !!UI.parentOk, parentRole: UI.parentRole || null, agentId: UI.agentId || null, at: Date.now()}));
  } catch (e) { /* التخزين غير متاح: تعمل الصفحة بدون استعادة */ }
}
// يعيد الشاشة السابقة بعد إعادة التحميل، ويرجع false إن لم توجد جلسة صالحة
function restoreSession(){
  let s = null;
  try { s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { s = null; }
  if (!s) return false;
  if (s.parentOk && s.parentRole && Date.now() - s.at < PARENT_IDLE_MS) {
    const agent = s.parentRole === 'guardian' ? agents().find(a => a.id === s.agentId) : null;
    if (s.parentRole === 'admin' || (agent && isActive(agent))) {
      UI.parentOk = true; UI.parentRole = s.parentRole; UI.agentId = agent ? agent.id : null;
      UI.kid = null; NAV.length = 0; CUR = null; armParentTimer();
      if (!UI.pchild || !CH(UI.pchild)) UI.pchild = S.children[0] ? S.children[0].id : null;
      if (s.parentRole === 'admin') renderAdminHome(); else renderGuardianHome();
      return true;
    }
  }
  if (s.kid && CH(s.kid)) { UI.parentOk = false; UI.kid = s.kid; NAV.length = 0; CUR = null; renderChild(s.kid); return true; }
  return false;
}

function winnersHtml(limit = 8, kids = S.children){
  const rank = kids.map(c => ({c, pts: P(c.id).stars || 0, wins: compWins(c.id)})).sort((a, b) => b.pts - a.pts || b.wins - a.wins);

  // آخر النتائج: كل المسابقات لمدير النظام والطفلة، ومسابقات أطفال الوكيل لوليّ الأمر
  const all = kids === S.children, ids = new Set(kids.map(c => c.id));
  const recent = [...S.comps].reverse().filter(x => all || (x.players || []).some(p => ids.has(p.cid))).slice(0, limit);
  const recRows = recent.length ? recent.map(x => {

  }).join('') : '<p class="muted">لا توجد مسابقات بعد</p>';

function recommendations(cid){
  const c = CH(cid), p = P(cid), rs = allResults(cid), out = [];
  if (!rs.length) return ['🌱 لا توجد بيانات بعد. ابدئي بجلسة اليوم، وستظهر التوصيات تلقائياً.'];
  Object.keys(SKILLS).forEach(s => { if (skillStatus(rs, s) === 'support') out.push(`🔴 <b>${SKILLS[s].n}</b>: أخطاء متكررة مؤخراً — ارجعي خطوة إلى المهارة السابقة، بسّطي النشاط، ثم كثّفي التدريب.`); });
  Object.entries(p.confusions).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 3).forEach(([k, n]) => { const [a, b] = k.split('|'); out.push(`🟠 تخلط بين «${a}» و«${b}» (${n} مرات): اختاري الحرفين في «الحروف التي أريد التدرب عليها» والعبي «صيد الحروف».`); });
  const wm = stat(rs.filter(r => r.s === 'ar_word_meaning' || r.s === 'ar_read_aloud').slice(-15));
  if (wm.n >= 5 && wm.ap >= 40) out.push('🟠 تعتمد على السماع في قراءة الكلمات: شجعيها على فك الكلمة صوتياً قبل الضغط على زر الاستماع.');
  if (skillStatus(rs, 'ar_letter_sound') === 'mastered') { const next = GROUPS.find(g => g.some(l => !c.arLetters.includes(l))); if (next) out.push(`🟢 أتقنت أصوات حروفها الحالية — مناسبة لإضافة المجموعة التالية: ${next.filter(l => !c.arLetters.includes(l)).join(' ')}`); }
  if (skillStatus(rs, 'ar_harakat') === 'mastered' && skillStatus(rs, 'ar_madd') === 'new') out.push('🟢 أتقنت الحركات القصيرة — ابدئي المدود.');
  if (skillStatus(rs, 'en_letter_name') === 'mastered' && c.enCount < 26) out.push(`🟢 أتقنت حروفها الإنجليزية — أضيفي حروفاً جديدة (حتى ${EN_LETTERS[Math.min(25, c.enCount + 3)]}).`);
  if (['m_recognize','m_count'].every(s => skillStatus(rs, s) === 'mastered') && c.mathMax < 100) out.push(`🟢 أتقنت الأعداد ضمن ${c.mathMax} — وسّعي النطاق من الإعدادات.`);
  if (skillStatus(rs, 'm_add') === 'mastered') out.push(`🟢 أتقنت الجمع حتى ${c.addMax} — يمكن رفع حد الجمع (مثلاً إلى ${c.addMax < 19 ? 19 : c.addMax < 50 ? 50 : 99}).`);
  if (skillStatus(rs, 'm_sub') === 'mastered') out.push(`🟢 أتقنت الطرح حتى ${c.subMax} — يمكن رفع حد الطرح.`);
  const tw = timeStats(cid).week; if (tw < 60) out.push(`⏱️ وقت التعلم هذا الأسبوع ${tw} دقيقة فقط — الهدف قرابة ${(c.minutes || 30) * 5} دقيقة أسبوعياً.`);
  const untried = Object.keys(SKILLS).filter(s => !rs.some(r => r.s === s));
  if (untried.length) out.push('⚪ مهارات لم تُجرَّب بعد: ' + untried.slice(0, 6).map(s => SKILLS[s].n).join('، ') + (untried.length > 6 ? '…' : ''));
  if (!out.length) out.push('🟢 التقدم متوازن. استمري على البرنامج مع المراجعة الدورية.');
  return out;
}

// قارئ ZIP مبسط (ملفات xlsx/pptx/docx هي ملفات ZIP) باستخدام DecompressionStream المدمج في المتصفح
async function unzip(buf){
  const dv = new DataView(buf);
  let e = buf.byteLength - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('zip');
  const cnt = dv.getUint16(e + 10, true); let off = dv.getUint32(e + 16, true); const files = {};
  for (let i = 0; i < cnt; i++) {
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true), nlen = dv.getUint16(off + 28, true), xlen = dv.getUint16(off + 30, true), clen = dv.getUint16(off + 32, true), lho = dv.getUint32(off + 42, true);
    files[new TextDecoder().decode(new Uint8Array(buf, off + 46, nlen))] = {method, csize, lho};
    off += 46 + nlen + xlen + clen;
  }
  return {names:Object.keys(files), async read(name){
    const f = files[name], lnl = dv.getUint16(f.lho + 26, true), lxl = dv.getUint16(f.lho + 28, true);
    const data = new Uint8Array(buf, f.lho + 30 + lnl + lxl, f.csize);
    if (f.method === 0) return new TextDecoder().decode(data);
    if (!('DecompressionStream' in window)) throw new Error('nodecomp');
    const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return new TextDecoder().decode(out);
  }};
}
function xmlText(xml){ const doc = new DOMParser().parseFromString(xml, 'application/xml'); return [...doc.getElementsByTagNameNS('*', 't')].map(n => n.textContent).join('\n'); }
async function loadPdfJs(){
  if (window.pdfjsLib) return window.pdfjsLib;
  const CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  // النسخة المحفوظة على الجهاز أولاً (تعمل دون إنترنت)، وإلا تُحمَّل مرة واحدة وتُحفظ
  let main = await idbGet('lib_pdfjs').catch(() => null), worker = await idbGet('lib_pdfjs_worker').catch(() => null);
  if (!main || !worker) {
    try {
      const get = u => fetch(u).then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.text(); });
      [main, worker] = await Promise.all([get(CDN + 'pdf.min.js'), get(CDN + 'pdf.worker.min.js')]);
      await idbPut('lib_pdfjs', main); await idbPut('lib_pdfjs_worker', worker);
    } catch (e) { throw new Error('قراءة PDF تحتاج اتصالاً بالإنترنت مرة واحدة على هذا الجهاز'); }
  }
  const asUrl = txt => URL.createObjectURL(new Blob([txt], {type: 'text/javascript'}));
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = asUrl(main); s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = asUrl(worker);
  return window.pdfjsLib;
}
// كل صفحة في PDF تصبح قصة: نصها + صورة مضغوطة للصفحة
async function pdfToStories(file){
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({data: await file.arrayBuffer()}).promise;
  const out = [];
  for (let i = 1; i <= Math.min(pdf.numPages, 20); i++) {
    const page = await pdf.getPage(i);
    const text = (await page.getTextContent()).items.map(x => x.str).join(' ').replace(/\s+/g, ' ').trim();
    const vp = page.getViewport({scale: 0.5}), cv = document.createElement('canvas');
    cv.width = vp.width; cv.height = vp.height;
    await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    out.push({id:uid(), text, image:cv.toDataURL('image/jpeg', 0.6), at:Date.now()});
  }
  return out;
}
let IMPORT_NOTES = []; // ملاحظات الاستيراد الحالي: صفحات مقتطعة، كلمات طويلة متجاوزة، حدّ الكلمات
async function extractText(file){
  const name = file.name.toLowerCase();
  if (name.endsWith('.txt') || name.endsWith('.csv')) return await file.text();
  const buf = await file.arrayBuffer();
  if (name.endsWith('.pdf')) {
    let lib; try { lib = await loadPdfJs(); } catch (e) { throw new Error('قراءة PDF تحتاج اتصالاً بالإنترنت مرة واحدة على هذا الجهاز، أو حوّلي الملف إلى txt'); }
    const pdf = await lib.getDocument({data:buf}).promise; let out = '';
    if (pdf.numPages > 40) IMPORT_NOTES.push(`قرأنا أول 40 صفحة من ${pdf.numPages}`);
    for (let i = 1; i <= Math.min(pdf.numPages, 40); i++) { const tc = await (await pdf.getPage(i)).getTextContent(); out += tc.items.map(x => x.str).join(' ') + '\n'; }
    return out;
  }
  const z = await unzip(buf);
  let parts;
  if (name.endsWith('.xlsx')) parts = z.names.filter(n => n === 'xl/sharedStrings.xml' || /^xl\/worksheets\/sheet\d+\.xml$/.test(n));
  else if (name.endsWith('.pptx')) parts = z.names.filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => parseInt(a.match(/\d+/)) - parseInt(b.match(/\d+/)));
  else if (name.endsWith('.docx')) parts = z.names.filter(n => n === 'word/document.xml');
  else throw new Error('نوع الملف غير مدعوم');
  let out = ''; for (const p of parts) out += xmlText(await z.read(p)) + '\n';
  return out;
}
// استخراج كلمات نظيفة من النص
function tokenize(text){
  text = text.normalize('NFKC');
  const seen = new Set(), out = [];
  let skippedLong = 0;
  for (const m of text.matchAll(/[ء-يً-ْٰ]+|[A-Za-z]+/g)) {
    let w = m[0]; const ar = isAr(w);
    if (!ar) w = w.toLowerCase();
    const key = ar ? strip(w) : w, len = ar ? plainLetters(w).length : w.length;
    if (len > (ar ? 9 : 12)) { skippedLong++; continue; }
    if (len < 2 || seen.has(key)) continue;
    seen.add(key); out.push(w);
    if (out.length >= 400) { IMPORT_NOTES.push('وصلنا إلى 400 كلمة (الحد لكل استيراد)'); break; }
  }
  if (skippedLong) IMPORT_NOTES.push(`تجاوزنا ${skippedLong} كلمة طويلة`);
  return out;
}

// جلب كلمات من الإنترنت
async function fetchWords(){
  const letter = ($('#netL').value || '').trim(), lang = $('#netLang').value, pos = $('#netPos').value, cnt = +$('#netCnt').value;
  if (!letter) return toast('اكتبي الحرف أولاً');
  const kid = $('#wKid') ? $('#wKid').value : '';
  if (!kid) return toast('اختاري الطفل أولاً');
  toast('جارِ الجلب من الإنترنت…');
  try {
    // الكلمات: 2 إلى 4 أحرف فقط، تحتوي الحرف المختار، ولا تضم إلا الحروف حتى هذا الحرف (مع و و ي)
    let words = [], L = letter;
    if (lang === 'en') {
      L = letter.toLowerCase();
      const pats = [];
      for (let n = 2; n <= 4; n++) for (let p = 0; p < n; p++) {
        if ((pos === 'start' && p !== 0) || (pos === 'end' && p !== n - 1) || (pos === 'mid' && (p === 0 || p === n - 1))) continue;
        pats.push('?'.repeat(p) + L + '?'.repeat(n - p - 1));
      }
      const res = await Promise.all([...new Set(pats)].map(sp => fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(sp)}&max=200&md=f`).then(r => r.json()).catch(() => [])));
      const seen = new Map();
      res.flat().forEach(x => { if (/^[a-z]{2,4}$/.test(x.word) && x.word.includes(L)) seen.set(x.word, +(((x.tags || []).find(t => t.startsWith('f:')) || 'f:0').slice(2))); });
      words = [...seen].map(([w, f]) => ({w, f})).sort((a, b) => (b.w[0] === L) - (a.w[0] === L) || b.f - a.f).map(x => x.w);
    } else {
      L = NORM[letter] || letter;
      const idx = AR_LETTERS.indexOf(L);
      if (idx < 0) return toast('اكتبي حرفاً عربياً');
      const allowed = new Set([...AR_LETTERS.slice(0, idx + 1), 'و', 'ي']);
      const res = await Promise.all([...allowed].map(pf => fetch(`https://ar.wiktionary.org/w/api.php?action=query&list=prefixsearch&pssearch=${encodeURIComponent(pf)}&pslimit=500&format=json&origin=*`).then(r => r.json()).catch(() => ({}))));
      const titles = new Set(res.flatMap(js => ((js.query && js.query.prefixsearch) || []).map(x => x.title)));
      words = [...titles].filter(w => {
        if (!/^[ء-يً-ْ]+$/.test(w) || w.startsWith('ال')) return false;
        const pl = plainLetters(w);
        if (pl.length < 2 || pl.length > 4 || !pl.every(c => allowed.has(c)) || !pl.includes(L)) return false;
        return pos === 'any' || (pos === 'start' ? pl[0] === L : pos === 'end' ? pl[pl.length - 1] === L : pl.slice(1, -1).includes(L));
      });
      // مرتبة بالحرف: التي تبدأ به أولاً، ثم التي تنتهي به، ثم الأقصر، ثم أبجدياً
      const rank = w => { const pl = plainLetters(w); return pl[0] === L ? 0 : pl[pl.length - 1] === L ? 1 : 2; };
      words.sort((a, b) => rank(a) - rank(b) || plainLetters(a).length - plainLetters(b).length || a.localeCompare(b, 'ar'));
    }
    const chosen = words.slice(0, cnt);
    if (!chosen.length) return toast('لم نجد كلمات مناسبة، جرّبي حرفاً أو موقعاً آخر');
    showImport(chosen, {target:lang === 'ar' ? L : '', review:true, kids:[kid]});
  } catch (e) { toast('تعذّر الاتصال بالإنترنت أو بالمصدر'); }
}

function modal(title, html, buttons){

    m.innerHTML = `<div class="mbox"><h3>${title}</h3><div class="mbody">${html}</div><div class="mbtns">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-mi="${i}">${b.label}</button>`).join('')}</div></div>`;

async function exportBackup(){
  try {
    S.settings.backupNo = (S.settings.backupNo || 0) + 1;
    save();
    // النسخة تحوي الحالة والتسجيلات والملفات المحفوظة على الجهاز، بصيغة قابلة للاستعادة في ملف واحد
    const items = await idbEntries(MEDIA_PREFIXES), media = {};

    const payload = {format:'academy-backup', formatVersion:2, appVersion:APP_VERSION, at:Date.now(), state:S, media};
    // تشفير اختياري بكلمة سر (AES-GCM مع PBKDF2)؛ الحقل الفارغ يعني نسخة غير مشفرة
    const pr = await modal('🔐 تشفير النسخة (اختياري)', '<input type="password" placeholder="كلمة سر للتشفير، أو اتركيها فارغة" style="text-align:center">', [{label:'تصدير', val:1}, {label:'إلغاء', val:0, cls:'ghost'}]);
    if (!pr.v) return;
    S.settings.lastBackupAt = Date.now(); save();
    let outText = JSON.stringify(payload);
    if ((pr.input || '').trim() && crypto.subtle) outText = JSON.stringify(await encryptBackup(outText, pr.input.trim()));
    const blob = new Blob([outText], {type:'application/json'}), a = document.createElement('a');

}

let OTP_TIMER = null;
function startOtpTimer(){
  clearInterval(OTP_TIMER); const end = Date.now() + 60000;
  const tick = () => {
    const t = $('#otpTimer'), b = $('#otpResend'); if (!t || !b) return clearInterval(OTP_TIMER);

async function emailStart(force){
  const msg = $('#emsg'), email = (($('#lemail') || {}).value || '').trim().toLowerCase(), pw = (($('#lpass') || {}).value || '');
  if (!S.cloud || !S.cloud.f) { msg.textContent = 'هذا الدخول يحتاج الرابط المحفوظ'; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = 'اكتبي بريداً صحيحاً'; return; }
  const a = agents().find(x => String(x.email || '').trim().toLowerCase() === email);
  if (!force && a && a.pwHash) {
    if (!pw) { msg.textContent = 'اكتبي كلمة المرور'; return; }
    if (await sha256hex(email + '|' + pw) !== a.pwHash) { msg.textContent = 'كلمة المرور غير صحيحة. استعيديها بزر «نسيت كلمة المرور؟»'; return; }

    UI.loginFails = 0; return enterParent('guardian', a);
  }
  msg.textContent = 'جارٍ الإرسال...';
  try {
    await emailApi('send', { f: S.cloud.f, email });
    $('#emailStep2').hidden = false; startOtpTimer();
    const first = document.querySelector('.otp'); if (first) first.focus();
    msg.textContent = 'أُرسل الرمز إلى البريد. صلاحيته 10 دقائق.';
  } catch (e) { msg.textContent = e.message; }
}

    const q = UI.q; if (!q) return;
    if (!window.caches || !window.isSecureContext) return toast('التحميل للعمل دون إنترنت يحتاج تشغيل البرنامج من رابط https وليس من ملف محلي');
    let saved = 0, failed = 0;
    try {
      const c = await caches.open('academy-quran-audio');
      for (const url of q.d.audio) {
        try {
          if (await c.match(url)) { saved++; continue; }      // محفوظة من قبل
          const r = await fetch(url, {mode: 'cors'});          // يحتاج أن يسمح الموقع بالطلب من المتصفح
          if (!r.ok) throw new Error('status ' + r.status);
          await c.put(url, r.clone()); saved++;

      }
    } catch (e) { return toast('تعذّر فتح مخزن التحميل في هذا المتصفح'); }
    toast(failed ? `حُفظت ${saved} آية، وتعذّر ${failed} (تحققي من الاتصال بالإنترنت)` : `تم حفظ ${saved} آية للعمل دون إنترنت ✅`);

    if (o.val === q.answer) { b.classList.add('right'); afterResolve(RUN.wrong ? 'x' : RUN.hinted ? 'a' : 'i'); return; }
    b.classList.add('wrong');
    if (q.word) addMistake(RUN.child.id, q.word);
    if (!RUN.wrong && q.confuse && !RUN.comp) { const k = q.confuse + '|' + o.val, cf = P(RUN.child.id).confusions; cf[k] = (cf[k] || 0) + 1; }
    RUN.wrong++;
    if (RUN.comp || RUN.fast) { const i = q.options.findIndex(x => x.val === q.answer); $$('.opt')[i].classList.add('reveal'); afterResolve('x', RUN.fast ? 700 : 1300); return; }

    speak([['جربي مرة أخرى', 'ar']]); wrongFeedback();
    if (RUN.wrong >= 2) { const i = q.options.findIndex(x => x.val === q.answer); $$('.opt')[i].classList.add('reveal'); }

  hint: () => {
    const q = RUN.q; if (RUN.resolved) return;
    if ((RUN.hintsUsed || 0) >= (RUN.hintMax ?? HINT_BASE)) { toast('انتهت التلميحات لهذا التدريب'); return; }
    RUN.hintsUsed = (RUN.hintsUsed || 0) + 1; RUN.hinted = true;
    const hb = document.querySelector('[data-act="hint"]'); if (hb) hb.outerHTML = hintBtn();
    if (q.type === 'choice') {
      const btns = $$('.opt'), wrongIdx = q.options.map((o, i) => i).filter(i => q.options[i].val !== q.answer && !btns[i].classList.contains('gone'));
      if (wrongIdx.length > 1) btns[pick(wrongIdx)].classList.add('gone');
      if (q.hintVisual) $('#hintBox').innerHTML = q.hintVisual;
      speak(q.hintSay || q.say);
    } else if (q.type === 'order') {
      let k = 0; while (k < RUN.picked.length && q.tiles[RUN.picked[k]].val === q.answer[k]) k++;
      RUN.picked = RUN.picked.slice(0, k);
      const ti = q.tiles.findIndex((t, i) => t.val === q.answer[k] && !RUN.picked.includes(i)); if (ti >= 0) RUN.picked.push(ti);

  saveKid: d => {
    const c = CH(d.id), has = s => !!$('#' + s + '_' + c.id), v = s => $('#' + s + '_' + c.id).value;
    const num = (s, lo, hi, def) => { if (!has(s)) return def; const n = parseInt(v(s), 10); return isNaN(n) ? def : Math.max(lo, Math.min(hi, n)); };
    const colorPicked = has('kc') && v('kc') !== c.color; // غيّرت الأم اللون يدوياً

    if (has('kn')) c.name = v('kn').trim() || c.name;
    if (has('kgen')) {
      const wasBoy = isBoy(c); c.gender = v('kgen') === 'm' ? 'm' : 'f';
      if (isBoy(c) !== wasBoy && !c.colorSet) c.color = isBoy(c) ? '#3aa0d8' : '#e75a8c'; // أزرق للولد، وردي للطفل
    }
    if (has('ke')) c.emoji = v('ke').trim() || c.emoji;
    if (has('km')) c.minutes = +v('km');
    if (has('kl')) c.enCount = +v('kl');

    if (has('kau')) c.audioAll = $('#kau_' + c.id).checked;

    if (has('karvoice')) c.arVoice = v('karvoice');
    if (has('kenvoice')) c.enVoice = v('kenvoice');
    if (has('ken')) c.enRoutine = $('#ken_' + c.id).checked;
    if (has('khn')) c.hideName = $('#khn_' + c.id).checked;
    if (has('kchat')) c.chatOff = !$('#kchat_' + c.id).checked;
    extPlatforms().forEach(([pid]) => { if (has('kext_' + pid)) { const on = $('#kext_' + pid + '_' + c.id).checked, rest = (c.extOff || []).filter(x => x !== pid); c.extOff = on ? rest : [...rest, pid]; } });
    if (has('kemail')) c.email = v('kemail').trim().toLowerCase();
    if (has('kcode') && v('kcode').trim()) {
      if (v('kcode').trim().length < 4) toast('رمز الدخول 4 خانات على الأقل، لم يُغيَّر الرمز');

    if (has('kqr')) c.quranReciter = v('kqr');
    if (has('kml')) c.mathLayout = v('kml');
    if (has('kma')) c.mathAnswer = v('kma');
    c.mathMax = num('kx', 5, 1000, c.mathMax); c.addMax = num('ka', 2, 1000, c.addMax); c.subMax = num('ks', 2, 1000, c.subMax);
    const oldLevel = levelRaw(c);

      if (nl !== oldLevel) c.levelSince = Date.now();

    }
    // الضرب والقسمة: التفعيل (تلقائي/يدوي/متوقف) والمضاريب المختارة
    ['mul', 'div'].forEach(op => {
      if (!has('kop_' + op)) return;
      const f = $$('.kfac_' + op + '_' + c.id).filter(x => x.checked).map(x => +x.value);

  const opts = shuffle([a, ...w]);

  ar_similar(ctx, t){
    const groups = SIMILAR.filter(g => g.filter(x => ctx.L.includes(x)).length >= 2);
    if (!groups.length) return null;
    const g = groups.find(gr => t && gr.includes(t)) || pick(groups);

// ----- منطق القياس والمكافآت -----
function masteredCount(cid, sub){
  const rs = allResults(cid);
  return Object.keys(SKILL_PATH).filter(k => !sub || k === sub).reduce((a, k) => a + SKILL_PATH[k].filter(s => skillStatus(rs, s) === 'mastered').length, 0);
}
// منع التجاوز: المهارة مقفلة حتى تُتقن السابقة لها في المسار (إن فعّل ولي الأمر الخيار)
function skillLocked(c, s){
  if (!c.strictOrder) return false;
  const rs = allResults(c.id);
  if ((HARD_PREREQ[s] || []).some(x => skillStatus(rs, x) !== 'mastered')) return true;
  const path = SKILL_PATH[SKILLS[s].sub] || [], i = path.indexOf(s);
  if (i <= 0) return false;
  return skillStatus(rs, path[i - 1]) !== 'mastered';
}
// مكافأة عند أول إتقان لكل مهارة فقط (لا تُمنح على مجرد اللعب)
// عند أول تشغيل للميزة تُسجَّل المهارات المتقنة سابقاً دون مكافأة رجعية
function awardMastery(cid){
  const p = P(cid), rs = allResults(cid);
  if (!p.masteryAwards) {
    p.masteryAwards = {};
    Object.keys(SKILLS).forEach(s => { if (skillStatus(rs, s) === 'mastered') p.masteryAwards[s] = 0; });
    return [];
  }
  // المهارة التي عدّلها ولي الأمر يدوياً لا تُمنح عليها مكافأة
  const fresh = Object.keys(SKILLS).filter(s => !p.masteryAwards[s] && !(p.overrides || {})[s] && skillStatus(rs, s) === 'mastered');
  fresh.forEach(s => { p.masteryAwards[s] = Date.now(); p.stars += MASTERY_BONUS; });
  return fresh;
}
// اختبار تحديد المستوى: ثلاث مهارات من كل مادة (أول وأوسط وآخر المسار)
function placementQueue(c){
  const q = [];
  // الضرب والقسمة يدخلان الاختبار دائماً إذا كانا مفعّلين لهذا الطفل
  if (c) ['m_mul', 'm_div'].forEach(x => { if (skillEnabled(c, x)) q.push(x); });
  Object.values(SKILL_PATH).forEach(full => { const path = full.filter(x => !c || skillEnabled(c, x)); [...new Set([0, Math.floor(path.length / 2), path.length - 1])].forEach(i => { if (path[i]) q.push(path[i]); }); });
  return q;
}
function finishPlacement(c, results){
  const bySub = {};
  Object.keys(SUBJECTS).forEach(k => { const rs = results.filter(r => SKILLS[r.s] && SKILLS[r.s].sub === k); if (rs.length) bySub[k] = stat(rs).ip; });
  const all = stat(results), level = all.n < 3 ? 0 : all.ip >= 80 ? 3 : all.ip >= 50 ? 2 : 1;
  if (level) { c.level = level; c.levelSince = Date.now(); }
  P(c.id).placement = {at: Date.now(), level: level || kidLevel(c), bySub};
  return level;
}
// أضعف المهارات (من ٣ إجابات فأكثر ولم تُتقن بعد)
function weakSkills(cid, n = 4){
  const rs = allResults(cid);
  return Object.keys(SKILLS).map(s => ({s, st: stat(rs.filter(r => r.s === s))}))
    .filter(o => o.st.n >= 3 && skillStatus(rs, o.s) !== 'mastered')
    .sort((a, b) => a.st.ip - b.st.ip).slice(0, n).map(o => o.s);
}
// المهارات التالية المقترحة: أول مهارة غير متقنة في كل مادة، الأضعف حالة أولاً
function nextSkills(c){
  const rs = allResults(c.id), out = [];
  Object.values(SKILL_PATH).forEach(path => {
    const s = path.find(x => skillAllowed(c, x) && !skillLocked(c, x) && skillStatus(rs, x) !== 'mastered');
    if (s) out.push(s);
  });
  return out.sort((a, b) => STATUS_ORDER[skillStatus(rs, a)] - STATUS_ORDER[skillStatus(rs, b)]);
}
function runSkills(c, skills, title, per = 5){
  skills = skills.filter(x => skillEnabled(c, x));
  const queue = []; skills.forEach(s => { for (let i = 0; i < per; i++) queue.push(s); });
  startRun(c, queue, {title, pool: skills});
}
// فترات زمنية متتالية (أسابيع أو أشهر) لحساب الاستقلالية
function periodBuckets(cid, count, span, labelFn){
  const rs = allResults(cid), now = Date.now(), out = [];
  for (let k = count - 1; k >= 0; k--) {
    const end = now - k * span, start = end - span;
    out.push({label: labelFn(k), st: stat(rs.filter(r => r.t >= start && r.t < end))});
  }
  return out;
}
function barsHTML(items){
  return `<div style="display:flex;align-items:flex-end;gap:6px;height:160px;padding:6px 0">${items.map(x => `<div style="flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-end"><div style="height:${Math.max(3, x.v)}%;background:${x.c};border-radius:8px 8px 0 0" title="${x.v}%"></div><small>${esc(x.label)}</small><small class="muted">${x.n}</small></div>`).join('')}</div>`;
}
function weekTable(cid){
  const rs = allResults(cid), now = Date.now(), W = 7 * DAYS_MS;
  const inWeek = k => rs.filter(r => r.t >= now - (k + 1) * W && r.t < now - k * W);
  const rows = Object.entries(SUBJECTS).map(([k, s]) => {
    const a = stat(inWeek(0).filter(r => SKILLS[r.s] && SKILLS[r.s].sub === k)), b = stat(inWeek(1).filter(r => SKILLS[r.s] && SKILLS[r.s].sub === k));
    const arrow = a.n && b.n ? (a.ip > b.ip ? '⬆️' : a.ip < b.ip ? '⬇️' : '➡️') : '—';
    return `<tr><td>${s.em} ${s.n}</td><td>${a.n}</td><td>${a.n ? a.ip + '%' : '—'}</td><td>${b.n}</td><td>${b.n ? b.ip + '%' : '—'}</td><td>${arrow}</td></tr>`;
  }).join('');
  return `<div class="tbl-wrap"><table><tr><th>المادة</th><th>هذا الأسبوع</th><th>استقلالية</th><th>الأسبوع الماضي</th><th>استقلالية</th><th>الاتجاه</th></tr>${rows}</table></div>`;
}

const BUILTIN_LESSONS = [{"id": "bl-letters", "title": "الحروف والأصوات: أ ب ت", "desc": "درس تأسيسي لأصوات الحروف الثلاثة الأولى", "minLevel": 1, "audience": "kid", "kind": "md", "body": "---\ntitle: الحروف والأصوات: أ ب ت\ndesc: درس تأسيسي لأصوات الحروف الثلاثة الأولى مع أمثلة ونشاط تمييز\n---\n\n> الهدف: أن تتعرّف الطفل على شكل كل حرف وصوته، وأن تميّز بين الباء والتاء.\n\n## حرف الألف (أ)\nالصوت: «أَ» كما في **أسد**.\n\n- كلمات تبدأ بالألف: أسد، أرنب، أم\n- نشاط: قولي صوت الحرف ثلاث مرات، ثم اطلبي منها أن تشير إلى كلمة تبدأ به.\n\n## حرف الباء (ب)\nالصوت: «بَ» كما في **بيت**.\n\n- كلمات تبدأ بالباء: بيت، بطة، باب\n- نشاط: ارسمي حرف الباء بإصبعك في الهواء ثم قولي صوته.\n\n## حرف التاء (ت)\nالصوت: «تَ» كما في **تفاح**.\n\n- كلمات تبدأ بالتاء: تفاح، تمر، توت\n- نشاط: ضعي تفاحة وبيتاً أمامها، واطلبي منها أن تضع يدها على الشيء الذي يبدأ بالتاء.\n\n## تمرين التمييز\nاقرئي الكلمات بصوت واضح، ثم اطلبي من الطفل أن تختار الإجابة الصحيحة:\n\n1. أي كلمة تبدأ بالباء؟ (أسد، بيت، تفاح) ← **بيت**\n2. أي كلمة تبدأ بالتاء؟ (تمر، أسد، باب) ← **تمر**\n3. أي كلمة تبدأ بالألف؟ (بطة، أرنب، توت) ← **أرنب**\n\n> نصيحة لولي الأمر: كرّري الدرس يومياً لمدة 5 دقائق، وامدحي كل إجابة صحيحة قبل الانتقال إلى التالي.\n"}, {"id": "bl-reading", "title": "القراءة والإملاء: بيتنا", "desc": "نص قصير للقراءة، وكلمات للإملاء", "minLevel": 2, "audience": "kid", "kind": "md", "body": "---\ntitle: القراءة والإملاء: بيتنا\ndesc: نص قصير للقراءة المتدرجة، وكلمات للإملاء مع تمرين إكمال الحرف الناقص\n---\n\n> الهدف: قراءة جملتين قصيرتين بتشكيل بسيط، وكتابة كلمات مألوفة بشكل صحيح.\n\n## القراءة\nاقرئي النص مرة واحدة أمامها، ثم اطلبي منها أن تقرأ كل جملة بعدك.\n\n**بَيْتُنَا كَبِيرٌ.**\n**فِيهِ حَدِيقَةٌ جَمِيلَةٌ.**\n\nأسئلة للفهم:\n- ما وصف البيت؟ ← كبير\n- ماذا في البيت؟ ← حديقة جميلة\n\n## الإملاء\nاكتبي الكلمات التالية بخط واضح، واطلبي من الطفل أن تكررها بعدك:\n\n- بيت\n- تمر\n- باب\n- بطة\n\n## تمرين إكمال الحرف الناقص\nاكتبي الكلمة مع فراغ، واطلبي منها أن تختار الحرف المناسب:\n\n1. ب _ ت ← **ي** (بيت)\n2. _ م ر ← **ت** (تمر)\n3. ب _ ب ← **ا** (باب)\n\n> نصيحة: إذا أخطأت الطفل في كلمة، اقرئيها ببطء مع تحريك كل حرف، ثم أعيدي كتابتها أمامها.\n"}, {"id": "bl-game", "title": "لعبة بالونات الحروف", "desc": "لعبة تفاعلية: اضغطي الحرف المطلوب", "minLevel": 1, "audience": "kid", "kind": "html", "body": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<title>لعبة بالونات الحروف</title>\n<style>\n  body { margin: 0; font-family: \"Tajawal\", \"Arial\", sans-serif; background: #fdf2f6; text-align: center; color: #333; }\n  #top { padding: 10px; font-size: 20px; }\n  #target { font-size: 56px; color: #c73f70; font-weight: bold; }\n  #field { position: relative; height: 70vh; overflow: hidden; }\n  .balloon { position: absolute; width: 70px; height: 84px; border-radius: 50%; background: #f7a8c4; color: #fff;\n             font-size: 40px; line-height: 84px; font-weight: bold; cursor: pointer; user-select: none; }\n  #msg { min-height: 26px; font-size: 18px; margin-top: 6px; }\n</style>\n</head>\n<body>\n<div id=\"top\">اضغطي البالون الذي عليه الحرف المطلوب ⭐ <span id=\"score\">0</span></div>\n<div id=\"target\">أ</div>\n<div id=\"field\"></div>\n<div id=\"msg\"></div>\n<script>\n  // لعبة تعليمية: حرف مطلوب، وبالونات تطفو، والإجابة الصحيحة تُكسب نجمة\n  const LETTERS = ['أ', 'ب', 'ت'];\n  const field = document.getElementById('field'), target = document.getElementById('target');\n  const scoreEl = document.getElementById('score'), msg = document.getElementById('msg');\n  let score = 0, rounds = 0, timer = null;\n\n  function newRound() {\n    rounds++;\n    if (rounds > 10) { msg.textContent = 'أحسنتِ! جمعتِ ' + score + ' نجوم 🎉'; clearInterval(timer); return; }\n    const want = LETTERS[Math.floor(Math.random() * LETTERS.length)];\n    target.textContent = want;\n    field.innerHTML = '';\n    LETTERS.forEach((ch, i) => {\n      const b = document.createElement('div');\n      b.className = 'balloon';\n      b.textContent = ch;\n      b.style.left = (10 + i * 30 + Math.random() * 5) + '%';\n      b.style.top = (40 + Math.random() * 40) + '%';\n      b.onclick = () => {\n        if (ch === want) { score++; scoreEl.textContent = score; msg.textContent = 'أحسنتِ ⭐'; setTimeout(newRound, 500); }\n        else { msg.textContent = 'حاولي مرة أخرى'; }\n      };\n      field.appendChild(b);\n    });\n  }\n  newRound();\n<\/script>\n</body>\n</html>\n"}, {"id": "bl-worksheet", "title": "كراسة تتبع الحروف", "desc": "كراسة للطباعة لتتبع الحروف أ ب ت", "minLevel": 1, "audience": "kid", "kind": "html", "body": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<title>كراسة تتبع الحروف: أ ب ت</title>\n<style>\n  body { font-family: \"Tajawal\", \"Arial\", sans-serif; margin: 16px; color: #333; }\n  h2 { text-align: center; color: #c73f70; }\n  .row { display: flex; align-items: center; gap: 12px; border-bottom: 2px dashed #f0b6cc; padding: 12px 0; }\n  .letter { font-size: 80px; color: #ddd; width: 110px; text-align: center; }\n  .lines { flex: 1; }\n  .line { height: 56px; border-bottom: 1px solid #bbb; }\n  .label { width: 70px; font-weight: bold; text-align: center; }\n  @media print { body { margin: 0; } .row { break-inside: avoid; } }\n</style>\n</head>\n<body>\n<h2>كراسة تتبع الحروف</h2>\n<p style=\"text-align:center\">اتبعي الحرف بالقلم، ثم اكتبيه في الخطوط الفارغة.</p>\n<div class=\"row\"><div class=\"label\">أ</div><div class=\"letter\">أ</div><div class=\"lines\"><div class=\"line\"></div><div class=\"line\"></div></div></div>\n<div class=\"row\"><div class=\"label\">ب</div><div class=\"letter\">ب</div><div class=\"lines\"><div class=\"line\"></div><div class=\"line\"></div></div></div>\n<div class=\"row\"><div class=\"label\">ت</div><div class=\"letter\">ت</div><div class=\"lines\"><div class=\"line\"></div><div class=\"line\"></div></div></div>\n</body>\n</html>\n"}, {"id": "bl-guide", "title": "دليل ولي الأمر: كيف نستفيد من الفيديو", "desc": "إرشادات لمتابعة الفيديو التعليمي مع الطفل", "minLevel": 1, "audience": "parent", "kind": "md", "body": "---\ntitle: دليل ولي الأمر: كيف نستفيد من الفيديو\ndesc: إرشادات قصيرة لمتابعة الفيديوهات التعليمية مع الطفل\n---\n\n> الفكرة: الفيديو يقدّم الصوت والحرف، والدور الأهم يبقى لولي الأمر في التكرار والمتابعة.\n\n## قبل المشاهدة\n1. اختاري فيديو قصيراً (5 إلى 10 دقائق).\n2. تأكدي من أن الصوت واضح، وأن المكان هادئ.\n\n## أثناء المشاهدة\n- توقفي عند كل حرف، وكرّري صوته مع الطفل.\n- اطلبي منها أن تشير إلى الحرف في الشاشة أو في الكتاب.\n\n## بعد المشاهدة\n- اسألي: ما الحرف الذي تعلمتِه اليوم؟ وما كلمة تبدأ به؟\n- امدحي المحاولة قبل النتيجة.\n\n## تنبيه\nلا تكتفي بالمشاهدة وحدها. الصوت يُتقن بالتكرار والنطق من الطفل نفسها.\n"}, {"id": "bl-phono", "title": "الوعي الصوتي: الكلمة والمقطع", "desc": "تدريب على سماع الأصوات وتقسيم الكلمة إلى مقاطع", "minLevel": 1, "audience": "kid", "kind": "md", "body": "---\ntitle: الوعي الصوتي: الكلمة والمقطع\ndesc: تدريب على سماع الأصوات وتقسيم الكلمة إلى مقاطع\n---\n\n> الهدف: أن تسمع الطفل الكلمة وتقسّمها إلى أصوات ومقاطع قبل أن تعرف الحروف.\n\n## الخطوة 1: تقسيم الكلمة بالتصفيق\nقولي الكلمة ببطء، واطلبي منها أن تصفّق مع كل مقطع:\n\n- ما: **صفقة واحدة**\n- ماما: **صفقتان**\n- سيارة: **ثلاث صفقات**\n\n## الخطوة 2: حذف المقطع\nقولي كلمة، ثم اطلبي منها أن تقولها بدون مقطعها الأول:\n\n1. بيتنا ← **تنا**\n2. قطة ← **طة**\n\n## الخطوة 3: إكمال الكلمة\nقولي مقطعين، واطلبي منها أن تقولهما معاً بسرعة: «با» + «ب» ← **باب**.\n\n> نصيحة لولي الأمر: خمس دقائق يومياً كافية، والمدح بعد كل إجابة صحيحة أهم من عدد الكلمات."}, {"id": "bl-kg", "title": "الروضة: تعرّف الحروف بالصورة", "desc": "ربط كل حرف بصورة كلمة تبدأ به", "minLevel": 1, "audience": "kid", "kind": "md", "body": "---\ntitle: الروضة: تعرّف الحروف بالصورة\ndesc: ربط كل حرف بصورة كلمة تبدأ به\n---\n\n> الهدف: أن تربط الطفل كل حرف بصورة مألوفة تبدأ به.\n\n## الحروف الأولى وصورها\n- **ب** ← بيت، بطة، باب\n- **م** ← ماء، موز، ماما\n- **ن** ← نجمة، نخلة، نملة\n\n## النشاط\n1. اعرضي ثلاث صور، وقولي اسم كل صورة بوضوح.\n2. اطلبي منها أن تشير إلى الصورة التي تبدأ بالحرف الذي تقولينه.\n3. اكتبي الحرف بجانب الصورة، وقولي صوته معها.\n\n> تنبيه: لا تنتقلي إلى حرف جديد قبل أن تتعرّف الطفل الحرف الحالي في ثلاث مرات متتالية."}, {"id": "bl-harakat", "title": "الحركات والمدود", "desc": "الفتحة والكسرة والضمة، ثم حروف المد", "minLevel": 2, "audience": "kid", "kind": "md", "body": "---\ntitle: الحركات والمدود\ndesc: الفتحة والكسرة والضمة، ثم حروف المد\n---\n\n> الهدف: أن تميّز الطفل بين الفتحة والكسرة والضمة، وأن تنطق حروف المد.\n\n## الحركات القصيرة\n- **الفتحة** (َ) صوتها «أَ»: ب + َ = **بَ**\n- **الكسرة** (ِ) صوتها «إِ»: ب + ِ = **بِ**\n- **الضمة** (ُ) صوتها «أُ»: ب + ُ = **بُ**\n\n## حروف المد\n- **ا** بعد الفتحة: بَ + ا = **با** (طويلة)\n- **و** بعد الضمة: بُ + و = **بو**\n- **ي** بعد الكسرة: بِ + ي = **بي**\n\n## تمرين\nاكتبي ثلاث كلمات بحركات مختلفة، واطلبي منها أن تقرأها بصوت عالٍ:\n\n1. بَيْت\n2. بُوم\n3. بِيض\n\n> نصيحة: اجعلي التمرين لعبة تصفيق، فكل مدّ يحتاج صفقتين."}, {"id": "bl-fluency", "title": "الطلاقة القرائية", "desc": "قراءة الجملة بسلاسة وسرعة معقولة", "minLevel": 2, "audience": "kid", "kind": "md", "body": "---\ntitle: الطلاقة القرائية\ndesc: قراءة الجملة بسلاسة وسرعة معقولة\n---\n\n> الهدف: أن تقرأ الطفل الجملة كاملة دون توقف طويل بين الكلمات.\n\n## التدرّج\n1. قراءة كلمة واحدة بوضوح.\n2. قراءة كلمتين متتاليتين.\n3. قراءة جملة قصيرة من ثلاث كلمات.\n\n## طريقة القراءة المشتركة\n- اقرئي الجملة أولاً بصوتك، وهي تتابعك بإصبعها.\n- ثم اقرئيها معاً.\n- أخيراً تقرأ وحدها.\n\n## مثال\n«قَطَّتِي تَنَامُ.» ← اقرئيها ثلاث مرات، كل مرة أسرع قليلاً.\n\n## علامات التقدم\n- تقرأ بدون توقف بين المقاطع.\n- تعيد قراءة الجملة من تلقاء نفسها عند الخطأ.\n\n> تنبيه: لا تصحّحي كل خطأ صغير، بل صحّحي الخطأ الذي يغيّر المعنى فقط."}, {"id": "bl-spelling", "title": "الإملاء: قواعد أساسية", "desc": "الهمزة، والتاء المربوطة، وأل القمرية والشمسية", "minLevel": 3, "audience": "kid", "kind": "md", "body": "---\ntitle: الإملاء: قواعد أساسية\ndesc: الهمزة، والتاء المربوطة، وأل القمرية والشمسية\n---\n\n> الهدف: أن تطبّق الطفل قواعد إملائية بسيطة في كتابتها.\n\n## أل القمرية والشمسية\n- **القمرية**: تُنطق اللام، مثل: الْقَمَرُ، الْبَيْتُ.\n- **الشمسية**: تُدغم اللام في الحرف بعدها، مثل: الشَّمْسُ، النَّجْمُ (لا تُكتب اللام مع النطق).\n\n## التاء المربوطة والمفتوحة\n- تُكتب التاء المربوطة (ة) في آخر الكلمة إن كانت تُنطق هاءً عند الوقف، مثل: مدرسة، حديقة.\n- تُكتب التاء المفتوحة (ت) في الأفعال، مثل: ذهبت، كتبت.\n\n## تمرين\nاكتبي الكلمات التالية، واطلبي منها أن تحدد نوع الحرف الأول:\n\n1. الشمس ← شمسية\n2. القمر ← قمرية\n3. مدرسة ← ة في آخرها\n\n> نصيحة: اربطي كل قاعدة بكلمة مألوفة، فالحفظ بالمثال أسهل من الحفظ بالقاعدة."}, {"id": "bl-comprehension", "title": "فهم القصة القصيرة", "desc": "أسئلة تساعد الطفل على فهم ما قرأته أو سمعته", "minLevel": 3, "audience": "kid", "kind": "md", "body": "---\ntitle: فهم القصة القصيرة\ndesc: أسئلة تساعد الطفل على فهم ما قرأته أو سمعته\n---\n\n> الهدف: أن تفهم الطفل الأحداث، وأن تتذكر الشخصيات والمكان والترتيب.\n\n## الأسئلة الأربعة\n1. **من؟** مَن شخصيات القصة؟\n2. **أين؟** أين وقعت الأحداث؟\n3. **ماذا حدث أولاً ثم بعده؟** رتّبي الأحداث.\n4. **لماذا؟** لماذا فعلت الشخصية ذلك؟\n\n## طريقة العمل\n- اقرئي القصة أو استمعي إليها مرة واحدة.\n- اطرحي الأسئلة الأربعة دون النظر إلى النص.\n- إن أخطأت الطفل، أعيدي قراءة الجملة المرتبطة بالسؤال فقط.\n\n## مثال قصير\nقصة: «ذهب علي إلى الحديقة، ووجد قطة صغيرة تحت الشجرة فساعدها.»\n- من؟ علي والقطة.\n- أين؟ في الحديقة.\n- ماذا حدث أولاً؟ ذهب علي، ثم وجد القطة.\n\n> تنبيه: الفهم يُبنى بالحوار، فاسألي عن رأيها أيضاً."}, {"id": "bl-remedial-reading", "title": "خطة علاج ضعف القراءة", "desc": "خطوات أسبوعية لمتابعة الطفل إذا تعثّرت في القراءة", "minLevel": 1, "audience": "parent", "kind": "md", "body": "---\ntitle: خطة علاج ضعف القراءة\ndesc: خطوات أسبوعية لمتابعة الطفل إذا تعثّرت في القراءة\n---\n\n> الفكرة: التعثر في القراءة يُعالج بالتكرار القصير والمنتظم، لا بالضغط.\n\n## الأسبوع الأول: تثبيت الحروف\n- راجعي الحروف التي تخلط بينها الطفل.\n- خمس دقائق يومياً مع كلمات تحتوي الحرف.\n\n## الأسبوع الثاني: الحركات\n- رك function genWorksheet(c, skills, count){
  const saved = RUN, out = [];
  RUN = {child:c, comp:false, fast:false, used:new Set(), onlyLetters:null, guided:false};
  try {
    for (let i = 0; i < count * 3 && out.length < count; i++) {
      const q = makeQuestion(skills[i % skills.length]);
      if (q && (q.type === 'choice' || q.type === 'order')) out.push(q);
    }
  } finally { RUN = saved; }
  return out;
}
function worksheetHTML(c, qs){
  const body = qs.map((q, i) => `<div style="break-inside:avoid;margin:10px 0;padding:8px;border-bottom:1px dashed #ccc"><b>${i + 1}.</b> ${esc(q.prompt)} ${q.visual || ''}

      ? `<div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:6px">${q.options.map(o => `<span>○ ${o.html}</span>`).join('')}</div>`
      : `<div style="margin-top:6px">رتّبي: ${q.tiles.map(t => `<span style="border:1px solid #999;padding:2px 8px;margin:2px;border-radius:6px">${t.html}</span>`).join('')}</div>`}</div>`).join('');
  const key = qs.map((q, i) => {
    const a = q.type === 'choice' ? ((q.options.find(o => o.val === q.answer) || {html:''}).html) : q.answer.join(' ');

  }).join(' — ');
  return `<div style="direction:rtl"><h2 style="text-align:center">ورقة عمل — ${esc(c.name)}</h2><p style="text-align:center">${new Date().toLocaleDateString('ar')} • ${qs.length} سؤالاً</p>${body}

}

    doPrint(worksheetHTML(c, qs));
  },
  micTry: () => {
    const q = RUN.q; if (!q || RUN.resolved) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { $('#micOut').textContent = 'المتصفح لا يدعم التعرف على الصوت، قيّمي نطقكِ بنفسكِ'; $('#rateBox').innerHTML = rateButtons('read'); return; }
    const rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 3;
    rec.onresult = e => {
      if (RUN.resolved) return;
      const heard = Array.from(e.results[0]).map(a => a.transcript.trim().toLowerCase());
      const ok = heard.some(h => h.split(/\s+/).includes(q.target));
      $('#micOut').textContent = ok ? `✅ ممتاز! سمعتُ: ${heard[0]}` : `🔁 سمعتُ: ${heard[0]} — حاولي مرة أخرى`;
      if (ok) afterResolve(RUN.hinted ? 'a' : 'i');
      else { RUN.wrong = (RUN.wrong || 0) + 1; if (RUN.wrong >= 2) $('#rateBox').innerHTML = rateButtons('read'); }
    };
    rec.onerror = () => { $('#micOut').textContent = 'تعذّر الاستماع، تأكدي من إذن الميكروفون'; $('#rateBox').innerHTML = rateButtons('read'); };
    rec.start(); $('#micOut').textContent = '🎧 أنصتُ…';
  },
  arRecStart: async d => {
    if (REC) return;
    if (!navigator.mediaDevices || !window.MediaRecorder) return toast('التسجيل غير مدعوم في هذا المتصفح');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio: true});
      const chunks = [], mr = new MediaRecorder(stream, recOpts());
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, {type: mr.mimeType || 'audio/webm'}), k = 'rec_' + d.id + '_' + Date.now();
        try {
          await idbPut(k, blob);
          const p = P(d.id); p.recs = p.recs || []; p.recs.push({k, at: Date.now()}); save(); toast('تم حفظ التسجيل 🎉');
        } catch (e) { toast('تعذّر حفظ التسجيل'); }
        REC = null; renderArLab(d.id);
      };
      mr.start(); REC = {mr, id: d.id}; renderArLab(d.id);
    } catch (e) { toast('اسمحي للمتصفح بالوصول إلى الميكروفون'); }
  },
  arRecStop: () => { if (REC) REC.mr.stop(); },
  arRecPlay: async d => {
    const b = await idbGet(d.k).catch(() => null);
    if (!b) return toast('التسجيل غير متوفر على هذا الجهاز');
    new Audio(URL.createObjectURL(b)).play();
  },
  arRecDel: async d => {
    if (!(await confirmBox('حذف التسجيل؟', ''))) return;
    P(d.id).recs = (P(d.id).recs || []).filter(r => r.k !== d.k); save();
    try { await idbPut(d.k, null); } catch (e) {}
    renderArLab(d.id);
  }
});

// مختبر الإملاء المتدرج: صوت الحرف ← المقطع ← الكلمة ← الجملة

Object.assign(GEN, {
  wr_dict_ladder(ctx, t){
    const tier = t && /^[1-4]:/.test(t) ? +t[0] : R(1, 4);
    if (tier === 1) {
      const l = pick(ctx.L.filter(x => x !== 'ا')); if (!l) return null;
      return {key:'wr_dict_ladder:1:' + l, type:'choice', prompt:'اسمعي صوت الحرف واكتبي الحرف الذي سمعتِه', say:[[letterSound(l), 'ar']],
        hintVisual:`<div class="emoji-xl">${AR_KEY[l][1]}</div>`, options:shuffle([l, ...letterDistractors(l, ctx.L, 3)]).map(x => ({val:x, html:`<span class="ar-letter">${x}</span>`})), answer:l, confuse:l};
    }
    if (tier === 2) {
      const l = pick(ctx.L.filter(x => x !== 'ا')); if (!l) return null;
      const forms = shuffle([l + FATHA, l + KASRA, l + DAMMA]), target = pick(forms);
      return {key:'wr_dict_ladder:2:' + target, type:'choice', prompt:'اسمعي المقطع واختاري الكتابة الصحيحة', say:[[target, 'ar']],
        options:forms.map(x => ({val:x, html:`<span class="ar-big" style="font-size:44px">${x}</span>`})), answer:target};
    }
    if (tier === 3) {
      const cand = ctx.words.filter(w => plainLetters(w.w).length >= 2 && plainLetters(w.w).length <= 4);
      if (cand.length < 4) return null;
      const w = pick(cand), others = shuffle(cand.filter(x => x !== w && x.w !== w.w)).slice(0, 3);
      return {key:'wr_dict_ladder:3:' + w.w, type:'choice', prompt:'اسمعي الكلمة واختاري كتابتها الصحيحة', say:[[w.w, 'ar']],
        options:shuffle([w, ...others]).map(x => ({val:x.w, html:`<span class="ar-big" style="font-size:40px">${esc(x.w)}</span>`})), answer:w.w};
    }
    const q = GEN.ar_sent_order(ctx);
    return {...q, key:'wr_dict_ladder:4:' + q.key, prompt:'اسمعي الجملة واكتبيها بترتيب كلماتها'};
  }
});

function addMistake(cid, w){
  const p = P(cid); p.mistakes = p.mistakes || {};
  p.mistakes[w] = (p.mistakes[w] || 0) + 1;
  // سجل زمني للأخطاء (بحد أقصى ٢٠٠٠ سجل) لتقارير الفترات؛ العداد التراكمي يبقى كما هو
  p.mistakeLog = p.mistakeLog || [];
  p.mistakeLog.push({w, t: Date.now()});
  if (p.mistakeLog.length > 2000) p.mistakeLog.splice(0, p.mistakeLog.length - 2000);
}
// يُحسب الترتيب المتدرج: هل تحتاج الطفل إلى ضبط الحركات قبل الكلمات الأصعب؟
function skillLevelGate(c){
  const rs = allResults(c.id);

// يُستعمل معياراً للترقية: ٦٠٪ من مهارات المستوى الحالي متقنة على الأقل
function levelMasteryShare(c){
  const rs = allResults(c.id), lv = kidLevel(c);
  const allowed = Object.values(SKILL_PATH).flat().filter(s => lv >= skillLevel(s));
  if (!allowed.length) return 0;
  return allowed.filter(s => skillStatus(rs, s) === 'mastered').length / allowed.length;
}
// مولّد سؤال إملاء لكلمة محددة (يُستعمل في الإملاء اليومي)
function dictWordQuestion(ctx, w){
  const others = shuffle(ctx.words.filter(x => x.w !== w.w)).slice(0, 3);
  if (others.length < 3) return null;
  return {key:'wr_dict_ladder:3:' + w.w, skill:'wr_dict_ladder', type:'choice', prompt:'اسمعي الكلمة واختاري كتابتها الصحيحة', say:[[w.w, 'ar']],
    options:shuffle([w, ...others]).map(x => ({val:x.w, html:`<span class="ar-big" style="font-size:40px">${esc(x.w)}</span>`})), answer:w.w, word:w.w};
}
Object.assign(SKILLS, {ar_mistakes:{sub:'ar', n:'كلماتي التي أخطئ فيها', em:'📕'}});

  ar_mistakes(ctx){

});

Object.assign(ACT, {
  readTest: d => go(() => renderReadTest(d.id)),
  readMark: d => { const i = +d.i; UI.read.marks[i] = !UI.read.marks[i]; renderReadTest(d.id); },
  readAns: d => { UI.read.ans[+d.q] = d.o; renderReadTest(d.id); },
  readSave: d => {
    const ps = READ_PASSAGES[d.id] || READ_PASSAGES.rima;
    const words = ps.text.replace(/[.،,]/g, ' ').split(/\s+/).filter(Boolean);
    const wrong = words.filter((_, i) => UI.read.marks[i]);
    const acc = Math.round((words.length - wrong.length) * 100 / words.length);
    const comp = Math.round(ps.qs.filter(([q, opts], qi) => UI.read.ans[qi] === opts[0]).length * 100 / ps.qs.length);
    wrong.forEach(w => addMistake(d.id, w));
    const p = P(d.id); p.readTests = p.readTests || []; p.readTests.push({at:Date.now(), acc, comp, wrong});
    save(); UI.read = null;
    const advice = acc >= 90 ? 'دقة ممتازة، يمكن الانتقال إلى نص أصعب.' : 'ركّزي على الدقة قبل السرعة: أعيدي قراءة الكلمات المعلّمة.';
    modal('نتيجة القراءة', `الدقة: <b>${acc}%</b><br>الفهم: <b>${comp}%</b><br>${advice}${wrong.length ? `<br>كلمات أُضيفت إلى قاموسكِ: ${wrong.map(esc).join('، ')}` : ''}`, [{label:'تم', val:1}]);

  mistakes: d => go(() => renderMistakes(d.id)),

  dictDaily: d => {

  },

      <div class="center"><button class="btn" data-act="readStoryAloud" data-i="${d.i}">🎧 اسمعي القصة</button></div>`;

function storyLevel(st){ return st.t.length <= 2 ? 1 : st.t.length <= 4 ? 2 : 3; }

  // اختيار صورة للطفل من هاتفها أو الآيباد: تُقصّ مربعةً وتُصغَّر لتبقى خفيفة
  pickPhoto: d => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      const url = URL.createObjectURL(f), img = new Image();
      img.onload = () => {
        const size = 240, cv = document.createElement('canvas'); cv.width = size; cv.height = size;
        const m = Math.min(img.width, img.height), sx = (img.width - m) / 2, sy = (img.height - m) / 2;
        cv.getContext('2d').drawImage(img, sx, sy, m, m, 0, 0, size, size);
        URL.revokeObjectURL(url);
        const c = CH(d.id); if (!c) return;
        c.photo = cv.toDataURL('image/jpeg', 0.82); save(); renderChild(d.id); toast('تم تغيير صورتك ✨');
      };
      img.onerror = () => { URL.revokeObjectURL(url); toast('تعذّر فتح هذه الصورة'); };
      img.src = url;
    };
    inp.click();
  },
  clearPhoto: d => { const c = CH(d.id); if (c) { delete c.photo; save(); renderChild(d.id); toast('تمت استعادة الصورة الأصلية'); } }
});
